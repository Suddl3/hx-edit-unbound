<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Mode</title>
<!--
  Focus Mode's page (focus_view.py serves it in the pane of focus_view.cs). It draws the selected block
  large in its scene, with its own controls, from two messages:
    {type: "catalog", catalog}  once: every model's name, picture, colour, scene and controls (HX Edit's own files)
    {type: "state", state}      whenever something changes: the preset's blocks, the selected one and its values,
                                the preset's number and name, its snapshots and the one that is on
    {type: "dsp", dsp}          each DSP's load as the Floor reports it ({used, budget, level}), for the bar's meters
  It asks for things with {name, value} messages: "exit" (back to the normal editor), "select" (a block of the
  chain strip), "set" (a value of the selected block: {dsp, id, key, value, phase}; a drag is "begin",
  "move"..., "end", so that HX Edit keeps it as one step of its undo; anything else is "single"), "model"
  (another model for the block: {dsp, id, symbol}), "capture" (a capture on the Floor: {dsp, id, slot}),
  "snapshot" (recall one: its place, 0 = snapshot 1), "preset" ("previous", "next" or a number of the list
  it was given), and "undo" / "redo" (HX Edit's own).
  The page has HX Edit's toolbar under it, so it carries its own: preset, snapshot, undo, the DSP meters.
  The layout keeps to what the Floor's own Focus View draws: title on top, the gear standing in its
  category's scene, the parameters below on black, each with its value above its name.
-->
<style>
  :root {
    --tint: 152 152 152;               /* the selected block's category colour (R G B), HX Edit's own */
    --ink: #f3f1ea;
    --dim: #96948f;
    --faint: rgb(255 255 255 / .09);
    --din: Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--ink); font-family: var(--din); overflow: hidden;
               user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 6px; }
  [hidden] { display: none !important; }

  .app { --lit: color-mix(in srgb, rgb(var(--tint)) 70%, white); height: 100%; display: grid;
         grid-template-rows: auto minmax(220px, 1fr) auto; }

  /* ---- top bar: back to the editor, preset, snapshot, undo, DSP; the signal chain under it ---------- */
  .bar { position: relative; z-index: 5; padding: 8px 22px 6px; background: #000; }
  .row1 { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 40px; }
  .bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .back { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 18px;
          background: rgb(255 255 255 / .07); font-size: 15px; white-space: nowrap; transition: background .15s; }
  .back:hover { background: rgb(255 255 255 / .14); }
  .back svg { width: 14px; height: 14px; }
  .switch { display: flex; align-items: center; height: 36px; border-radius: 18px; background: rgb(255 255 255 / .07); min-width: 0; }
  .switch[hidden] { display: none; }
  .switch .step { width: 32px; height: 36px; display: grid; place-items: center; color: var(--dim); border-radius: 18px; flex: none; }
  .switch .step:hover { color: var(--ink); background: rgb(255 255 255 / .1); }
  .switch .step svg { width: 12px; height: 12px; }
  .switch .name { height: 36px; padding: 0 8px; font-size: 18px; display: inline-flex; align-items: center; gap: 9px; max-width: 380px;
                  white-space: nowrap; min-width: 0; }
  .switch .name .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  .switch .name span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
  .switch .name svg { width: 10px; height: 10px; opacity: .55; flex: none; }
  .switch .name:hover svg { opacity: 1; }
  .switch .name:disabled { cursor: default; }
  .switch .name:disabled svg { display: none; }
  .snap { height: 36px; padding: 0 14px 0 6px; border-radius: 18px; display: inline-flex; align-items: center; gap: 9px; font-size: 16px;
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16); max-width: 300px; white-space: nowrap; }
  .snap i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; flex: none;
            background: rgb(255 255 255 / .12); font-variant-numeric: tabular-nums; }
  .snap span { overflow: hidden; text-overflow: ellipsis; }
  .snap svg { width: 10px; height: 10px; opacity: .55; flex: none; }
  .snap:hover svg { opacity: 1; }
  .bar-right { display: flex; align-items: center; justify-content: flex-end; gap: 18px; }
  .pair { display: flex; gap: 2px; }
  .icon { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; color: var(--ink); }
  .icon svg { width: 17px; height: 17px; }
  .icon:hover { background: rgb(255 255 255 / .1); }
  .icon:disabled { color: #55544f; cursor: default; background: none; }
  .dsp { display: flex; gap: 16px; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dsp div { display: grid; grid-template-columns: auto 72px auto; align-items: center; gap: 7px; }
  .dsp i { height: 4px; border-radius: 2px; background: var(--faint); overflow: hidden; display: block; }
  .dsp i b { display: block; height: 100%; border-radius: 2px; background: #3fc56b; }
  .dsp .yellow b { background: #e3b63a; } .dsp .red b { background: #e2483c; }
  .dsp .yellow span:last-child, .dsp .red span:last-child { color: var(--ink); }
  .pill { height: 32px; padding: 0 13px; border-radius: 16px; font-size: 14px; color: var(--dim);
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16); white-space: nowrap; transition: color .15s, box-shadow .15s; }
  .pill:hover { color: var(--ink); }
  .pill[aria-pressed=true] { color: var(--ink); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .5); }
  .drop { position: absolute; top: 50px; z-index: 8; width: 240px; max-height: 420px; overflow-y: auto; padding: 8px; border-radius: 12px;
          background: rgb(8 8 10 / .94); backdrop-filter: blur(22px); box-shadow: 0 0 0 1px rgb(255 255 255 / .12), 0 24px 60px rgb(0 0 0 / .8); }
  .drop button { width: 100%; display: grid; grid-template-columns: 30px 1fr; align-items: center; height: 32px; padding: 0 8px; border-radius: 8px;
                 font-size: 15.5px; text-align: left; }
  .drop button span:first-child { color: var(--dim); font-variant-numeric: tabular-nums; }
  .drop button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop button:hover { background: rgb(255 255 255 / .08); }
  .drop button.cur { background: rgb(255 255 255 / .1); box-shadow: inset 3px 0 0 #fff; }
  .drop.presets { width: 330px; max-height: min(480px, 100vh - 70px); scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .drop.presets button { grid-template-columns: 42px 1fr; }
  .toast { position: absolute; left: 50%; top: 112px; z-index: 9; transform: translateX(-50%); max-width: 560px; padding: 10px 16px;
           border-radius: 10px; background: rgb(8 8 10 / .94); box-shadow: 0 0 0 1px rgb(255 255 255 / .16), 0 18px 40px rgb(0 0 0 / .7);
           font-size: 15px; line-height: 1.35; text-align: center; }
  .toast[hidden] { display: none; }

  .chain { display: flex; align-items: flex-start; justify-content: center; gap: 6px; position: relative; padding-top: 2px; margin-top: 8px; min-height: 66px; }
  .run { display: flex; align-items: flex-start; gap: 6px; position: relative; }
  .run::before { content: ''; position: absolute; left: 30px; right: 30px; top: 22px; height: 2px;
                 background: linear-gradient(90deg, #3a3a3d, #56565a 50%, #3a3a3d); }
  .blk { position: relative; width: 74px; display: grid; justify-items: center; gap: 6px; cursor: default; }
  button.blk { cursor: pointer; }
  button.blk:hover .pic { transform: translateY(-1px); box-shadow: 0 0 0 1.5px rgb(var(--c)); }
  button.blk.sel:hover .pic { transform: none; box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff, 0 0 18px 2px rgb(var(--c) / .6); }
  .blk .pic { width: 44px; height: 44px; border-radius: 11px; background: #0d0d0f; display: grid; place-items: center;
              box-shadow: 0 0 0 1.5px rgb(var(--c) / .55); transition: box-shadow .15s, transform .15s; }
  .blk .pic img { width: 36px; height: 36px; object-fit: contain; }
  .blk .nm { font-size: 11.5px; line-height: 1.1; color: var(--dim); max-width: 72px; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; font-stretch: 87%; }
  .blk.sel .pic { box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff, 0 0 18px 2px rgb(var(--c) / .6); }
  .blk.sel .nm { color: var(--ink); }
  .blk.off .pic img { opacity: .38; filter: grayscale(.8); }
  .blk.off .pic { box-shadow: 0 0 0 1.5px rgb(var(--c) / .22); }
  .blk.off.sel .pic { box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff; }
  .blk.low .pic { margin-top: 0; }
  .blk.low::after { content: 'B'; position: absolute; right: 9px; top: -3px; font-size: 10px; line-height: 13px; width: 13px; text-align: center;
                    border-radius: 7px; background: #2a2a2d; color: var(--ink); }
  .mark { align-self: flex-start; margin: 12px 4px 0; padding: 2px 8px; font-size: 11px; color: var(--dim);
          border-radius: 8px; box-shadow: inset 0 0 0 1px #3a3a3d; white-space: nowrap; }

  /* ---- the scene: the block's gear standing in its scene ------------------------------------ */
  .scene { position: relative; overflow: hidden; background: #000; isolation: isolate; }
  .plate { position: absolute; inset: 0; opacity: 0; transition: opacity .55s ease; }
  .plate.on { opacity: 1; }
  .plate img { position: absolute; max-width: none; transform: translate(calc(var(--px, 0) * -12px), calc(var(--py, 0) * -7px));
               transition: transform .5s cubic-bezier(.2, .7, .2, 1), filter .4s; filter: brightness(var(--gain, 1)); }
  .app.off .plate img { filter: brightness(calc(var(--gain, 1) * .42)) saturate(.25); }
  .veil { position: absolute; inset: 0; pointer-events: none;
          background: linear-gradient(180deg, #000 0, rgb(0 0 0 / 0) 11%, rgb(0 0 0 / 0) 72%, rgb(0 0 0 / .8) 91%, #000 100%),
                      radial-gradient(120% 90% at 50% 55%, rgb(0 0 0 / 0) 45%, rgb(0 0 0 / .7) 100%); }
  .gear { position: absolute; transform: translate(calc(var(--px, 0) * 7px), calc(var(--py, 0) * 3px));
          transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
  .gear .halo { position: absolute; left: 50%; bottom: 8%; width: 170%; height: 120%; translate: -50% 0; pointer-events: none;
                background: radial-gradient(closest-side, rgb(var(--tint) / .2), rgb(var(--tint) / 0) 70%); transition: opacity .4s; }
  .gear .shadow { position: absolute; left: 50%; bottom: -3%; height: 13%; translate: -50% 0; border-radius: 50%;
                  background: radial-gradient(closest-side, rgb(0 0 0 / .85), rgb(0 0 0 / 0)); filter: blur(4px); }
  .gear canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%;
                 filter: drop-shadow(0 18px 22px rgb(0 0 0 / .55)); transition: filter .4s, opacity .25s; }
  .gear canvas.in { animation: arrive .42s cubic-bezier(.2, .8, .2, 1); }
  @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.975); } }
  .app.off .gear canvas { filter: drop-shadow(0 18px 22px rgb(0 0 0 / .55)) brightness(.5) saturate(.45); }
  .app.off .gear .halo { opacity: 0; }
  .app.empty .gear, .app.empty .title, .app.empty .floor, .app.empty .deck > * { visibility: hidden; }

  .title { position: absolute; left: 34px; bottom: 22px; display: grid; justify-items: start; gap: 2px; z-index: 2; max-width: 34%; }
  .title .cat { font-size: 16px; font-weight: 600; color: var(--lit); display: flex; align-items: center; gap: 9px; }
  .title .cat::before { content: ''; width: 11px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 2px rgb(var(--tint)); }
  .title .model { font-size: clamp(34px, 6.4vh, 68px); line-height: .98; font-weight: 700; font-stretch: 75%; text-align: left;
                  letter-spacing: .005em; text-shadow: 0 2px 18px #000; }
  .title .capture { font-size: clamp(18px, 2.6vh, 26px); margin-top: 6px; color: #dcdad3; text-shadow: 0 2px 12px #000;
                    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title button { display: inline-flex; align-items: center; gap: 12px; max-width: 100%; }
  .title button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title button svg { width: .42em; height: .42em; opacity: .5; flex: none; transition: opacity .15s, transform .15s; }
  .title button.capture svg { width: .62em; height: .62em; }
  .title button:hover svg { opacity: 1; transform: translateY(2px); }
  .title button:disabled { cursor: default; }
  .title button:disabled svg { display: none; }

  /* the list you open on purpose: models, or the captures on the Floor */
  .picker { position: absolute; left: 0; top: 0; bottom: 0; width: 392px; z-index: 4; display: grid; grid-template-rows: auto auto auto 1fr;
            background: rgb(8 8 10 / .88); backdrop-filter: blur(22px) saturate(1.2); box-shadow: 1px 0 0 rgb(255 255 255 / .1), 30px 0 80px rgb(0 0 0 / .6);
            transform: translateX(-104%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .picker.open { transform: none; }
  .scene.picking .title { visibility: hidden; }             /* the list covers the title: a long name must not peek out beside it */
  .picker header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 22px 10px 26px; }
  .picker h2 { margin: 0; font-size: 22px; font-weight: 600; font-stretch: 87%; }
  .picker header button { font-size: 14px; color: var(--dim); }
  .picker header button:hover { color: var(--ink); }
  .picker input { margin: 0 22px 10px 26px; height: 38px; border-radius: 9px; border: 0; padding: 0 12px; font: inherit; font-size: 15px;
                  color: var(--ink); background: rgb(255 255 255 / .08); user-select: text; -webkit-user-select: text; }
  .picker input:focus-visible { outline: 0; box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .55); }
  .picker input::placeholder { color: var(--dim); }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 10px 24px; }
  .kinds button { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; color: var(--dim); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .kinds button:hover { color: var(--ink); }
  .kinds button.on { color: #000; background: rgb(var(--k)); box-shadow: none; }
  .rows { overflow-y: auto; padding: 2px 12px 18px 16px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .rows h3 { margin: 12px 10px 4px; font-size: 13px; font-weight: 400; color: var(--dim); }
  .row { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px; padding: 5px 10px; border-radius: 10px;
         text-align: left; font-size: 16px; }
  .row img { width: 48px; height: 48px; object-fit: contain; }
  .row small { font-size: 12.5px; color: var(--dim); }
  .row:hover { background: rgb(255 255 255 / .07); }
  .row.cur { background: rgb(var(--tint) / .16); box-shadow: inset 3px 0 0 rgb(var(--tint)); }
  .rows p { color: var(--dim); font-size: 14px; padding: 8px 10px; margin: 0; }
  .hint { position: absolute; left: 50%; top: 46%; translate: -50% -50%; z-index: 2; text-align: center; font-size: 19px; color: var(--dim);
          max-width: 520px; line-height: 1.45; }
  .hint b { display: block; color: var(--ink); font-size: 26px; font-weight: 600; font-stretch: 87%; margin-bottom: 6px; }

  /* what the Floor's own 800 x 480 screen would draw for this block */
  .floor { position: absolute; right: 26px; bottom: 22px; z-index: 2; width: 320px; transition: opacity .25s, transform .25s; }
  .floor.away { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .floor .cap { font-size: 12.5px; color: var(--dim); margin-bottom: 7px; display: flex; justify-content: space-between; }
  .floor .frame { width: 320px; height: 192px; border-radius: 6px; overflow: hidden; background: #000;
                  box-shadow: 0 0 0 1px rgb(255 255 255 / .22), 0 16px 40px rgb(0 0 0 / .7); }
  .lcd { width: 800px; height: 480px; transform: scale(.4); transform-origin: 0 0; position: relative; background: #000; }
  .lcd .bg { position: absolute; inset: 0; width: 800px; height: 480px; }
  .lcd canvas { position: absolute; left: 272px; top: 68px; width: 256px; height: 256px; object-fit: contain; object-position: 50% 100%; }
  .lcd .line { position: absolute; left: 12px; top: 342px; width: 400px; height: 2px; background: rgb(var(--tint)); }
  .lcd .who { position: absolute; left: 12px; top: 352px; font-size: 19px; display: flex; gap: 8px; align-items: center; }
  .lcd .who i { width: 14px; height: 14px; box-shadow: inset 0 0 0 2px rgb(var(--tint)); display: block; }
  .lcd .who b { color: rgb(var(--tint)); }
  .lcd .cols { position: absolute; left: 0; right: 0; top: 392px; display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; }
  .lcd .cols div { display: grid; gap: 8px; }
  .lcd .cols u { text-decoration: none; font-size: 18px; color: rgb(var(--tint)); border-top: 2px solid rgb(var(--tint) / .7);
                 margin: 0 26px; padding-top: 5px; white-space: nowrap; overflow: hidden; }
  .lcd .cols s { text-decoration: none; font-size: 22px; white-space: nowrap; overflow: hidden; }
  .app.off .lcd canvas { opacity: .5; }

  /* ---- the deck: bypass and the block's own controls ---------------------------------------- */
  .deck { position: relative; z-index: 3; background: linear-gradient(180deg, #0d0d10 0, #050506 100%); padding: 26px 190px 22px; min-height: 196px;
          display: flex; align-items: center; justify-content: center; }
  .deck::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
                  background: linear-gradient(90deg, rgb(var(--tint)) 0, rgb(var(--tint) / .5) 30%, rgb(var(--tint) / 0) 58%); transition: opacity .3s; }
  .app.off .deck::before { opacity: .35; }
  .bypass { position: absolute; left: 44px; top: 50%; translate: 0 -50%; display: grid; justify-items: center; gap: 13px; }
  .stomp { width: 78px; height: 78px; border-radius: 50%; position: relative; background: #050505; display: block;
           box-shadow: 0 0 0 2px #17181a, 0 0 0 7px rgb(var(--tint)), 0 0 30px 7px rgb(var(--tint) / .5), inset 0 0 0 5px #000;
           transition: box-shadow .25s; }
  .stomp::after { content: ''; position: absolute; inset: 15%; border-radius: 50%;
                  background: radial-gradient(circle at 50% 26%, #f4f5f6 0, #b9bbc0 20%, #74767c 52%, #2b2c30 100%);
                  box-shadow: 0 6px 10px rgb(0 0 0 / .8), inset 0 -3px 5px rgb(0 0 0 / .5); transition: transform .08s; }
  .stomp:active::after { transform: translateY(2px) scale(.975); }
  .stomp:focus-visible { outline-offset: 12px; border-radius: 50%; }
  .stomp[aria-pressed=false] { box-shadow: 0 0 0 2px #17181a, 0 0 0 7px rgb(var(--tint) / .2), 0 0 0 0 rgb(var(--tint) / 0), inset 0 0 0 5px #000; }
  .bypass span { font-size: 14.5px; color: var(--dim); }
  .stomp[aria-pressed=true] + span { color: var(--ink); }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px 6px; --k: 84px; }
  .controls.m { --k: 68px; }
  .controls.s { --k: 58px; gap: 16px 0; }
  .ctl { width: calc(var(--k) + 40px); display: grid; justify-items: center; align-content: start; text-align: center; position: relative; }
  .ctl .val { margin-top: 13px; height: 19px; font-size: 15px; line-height: 19px; color: var(--lit); font-variant-numeric: tabular-nums;
              white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; transition: color .2s; }
  .ctl .nm { font-size: 15.5px; line-height: 20px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .controls.s .ctl .val, .controls.s .ctl .nm { font-size: 13.5px; font-stretch: 90%; }
  .app.off .ctl .val { color: var(--dim); }
  .sync { position: absolute; top: -9px; right: -2px; height: 19px; padding: 0 9px; border-radius: 10px; font-size: 12px; line-height: 19px;
          color: var(--dim); background: #0b0b0d; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18); }
  .sync:hover { color: var(--ink); }
  .sync.on:hover { color: #000; }
  .sync.on { color: #000; background: var(--lit); box-shadow: none; }

  .dial { position: relative; width: var(--k); height: var(--k); border-radius: 50%; cursor: ns-resize; touch-action: none; }
  .dial:focus-visible { outline-offset: 12px; border-radius: 50%; }
  .ctl.live .val { color: #fff; }
  .ctl.live .hand { transition: none; }
  .ring { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); overflow: visible; fill: none; stroke-linecap: round; }
  .ring .track { stroke: rgb(255 255 255 / .1); stroke-width: 3; }
  .ring .fill { stroke: rgb(var(--tint)); stroke-width: 3.4; filter: drop-shadow(0 0 4px rgb(var(--tint) / .8)); transition: stroke .25s; }
  .ring .dot { fill: rgb(255 255 255 / .26); stroke: none; }
  .ring .dot.on { fill: rgb(var(--tint)); filter: drop-shadow(0 0 4px rgb(var(--tint))); }
  .app.off .ring .fill { stroke: #6b6a66; filter: none; }
  .app.off .ring .dot.on { fill: #8a8985; filter: none; }
  .skirt { position: absolute; inset: 8%; border-radius: 50%; background: repeating-conic-gradient(#141517 0 3deg, #303136 3deg 6deg);
           box-shadow: 0 12px 18px rgb(0 0 0 / .8), 0 0 0 1px #000; }
  .cap { position: absolute; inset: 16%; border-radius: 50%;
         background: conic-gradient(from 205deg, #3d3e43, #191a1c 22%, #47484e 48%, #17181a 74%, #3d3e43);
         box-shadow: inset 0 1px 1px rgb(255 255 255 / .28), inset 0 -2px 5px rgb(0 0 0 / .65), 0 2px 4px rgb(0 0 0 / .7); }
  .hand { position: absolute; inset: 8%; transform: rotate(var(--a, 0deg)); pointer-events: none; transition: transform .12s ease-out; }

<script>

}

const cut = new Map();                                    // url -> Promise<{canvas, w, h} | null>

    const img = new Image();

        const data = pen.getImageData(0, 0, w, h).data;

}
function paint(target, source) {

  if (source) target.getContext('2d').drawImage(source.canvas, 0, 0);
}

const model = block => (catalog.models[block.model]) || {name: block.model, category: '', key: '', tint: [152, 152, 152], pictures: [], scene: null, params: []};

  const groups = [];

// ---- the scene ----------------------------------------------------------------------------------
function place() {

function showScene(name) {

    if (!sc.small || img.getAttribute('src') === sc.small.picture) return;

  const gear = $('gearPicture');

// ---- the deck -----------------------------------------------------------------------------------

}

  dial.onkeydown = e => {
    if (['ArrowUp', 'ArrowRight'].includes(e.key)) nudge(1, e.shiftKey);
    else if (['ArrowDown', 'ArrowLeft'].includes(e.key)) nudge(-1, e.shiftKey);
    else return;
    e.preventDefault();
  };
  dial.ondblclick = () => { if (!synced(p) && typeof p.default === 'number') push(p.default, 'single'); };
}
function control(p) {
  const el = document.createElement('div'); el.className = 'ctl'; el.dataset.id = p.id;
  if (p.kind === 'switch') el.innerHTML = '<button class="lever" role="switch"><span class="led"></span><span class="nut"></span><span class="bat"></span></button><div class="val"></div><div class="nm"></div>';
  else el.innerHTML = '<div class="dial" role="slider" tabindex="0"><svg class="ring" viewBox="0 0 100 100"></svg><span class="skirt"></span><span class="cap"></span><span class="hand"></span></div><div class="val"></div><div class="nm"></div>';
  if (p.sync) el.insertAdjacentHTML('beforeend', '<button class="sync" title="Follow the tempo">Sync</button>');
  el.querySelector('.nm').textContent = p.name;
  (el.querySelector('.dial') || el.querySelector('.lever')).setAttribute('aria-label', p.name);
  return el;
}
function fill(el, p) {
  const value = valueOf(p.id);
  el.querySelector('.val').textContent = text(p);
  if (p.kind === 'switch') {
    const up = value === true || (typeof value === 'number' && value === p.max);
    el.querySelector('.lever').classList.toggle('down', !up);
    el.querySelector('.lever').setAttribute('aria-checked', up);
    return;
  }
  const names = synced(p) ? notes() : p.kind === 'steps' ? positions(p) : null;
  const n = names ? names.length : 0;
  const t = position(p);
  el.querySelector('.dial').style.setProperty('--a', (-135 + 270 * t) + 'deg');
  el.querySelector('.dial').setAttribute('aria-valuetext', text(p));
  const ring = el.querySelector('.ring'), key = n && n <= 12 ? 'dots' + n + ':' + Math.round(t * (n - 1)) : 'arc' + t.toFixed(4);
  if (ring.dataset.key !== key) {
    ring.dataset.key = key;
    ring.innerHTML = n && n <= 12
      ? Array.from({length: n}, (_, i) => {
          const a = (135 + 270 * i / (n - 1)) * Math.PI / 180;
          return `<circle class="dot${Math.round(t * (n - 1)) === i ? ' on' : ''}" cx="${50 + 45 * Math.cos(a)}" cy="${50 + 45 * Math.sin(a)}" r="2.7"/>`;
        }).join('')
      : `<path class="track" d="${ARC}"/><path class="fill" d="${ARC}" pathLength="100" stroke-dasharray="${Math.max(.01, t * 100)} 100"/>`;
  }
  const sync = el.querySelector('.sync'); if (sync) sync.classList.toggle('on', synced(p));
}
function drawDeck(block) {
  const list = controlsOf(block), box = $('controls'), key = block.dsp + '|' + block.id + '|' + block.model;
  if (key !== shownKey) {                                      // another block: its own set of controls
    shownKey = key; held.clear();
    box.className = 'controls' + (list.length > 11 ? ' s' : list.length > 8 ? ' m' : '');
    box.replaceChildren(...list.map(p => { const el = control(p); wire(el, p, block); return el; }));
  }
  list.forEach((p, i) => fill(box.children[i], p));
  // Bypass: only what HX Edit can bypass (not an input or an output).
  $('bypass').hidden = model(block).bypass !== true;
  $('stomp').setAttribute('aria-pressed', block.enabled);
  $('stomp').onclick = () => ask('set', {dsp: block.dsp, id: block.id, key: '@enabled', value: !block.enabled, phase: 'single'});
  $('stompText').textContent = block.enabled ? 'On' : 'Bypassed';
}

// ---- what the Floor's Focus View draws: the same scene and picture, and its own first page of six ----
function drawFloor(block) {
  const m = model(block), sc = m.scene && catalog.scenes[m.scene];
  const small = sc ? (sc.small ? sc.small.picture : sc.pictures[sc.pictures.length - 1]) : '';
  if ($('lcdBg').getAttribute('src') !== small) { if (small) $('lcdBg').src = small; else $('lcdBg').removeAttribute('src'); }
  $('lcdCat').textContent = m.category; $('lcdModel').textContent = m.name;
  const page = m.params.map(p => ({name: p.name, text: isNam(block) && p.id === 'Index' ? (capture(block) || {}).name || '' : text(p)}));
  const cols = $('lcdCols');
  while (cols.children.length < Math.min(6, page.length)) cols.insertAdjacentHTML('beforeend', '<div><u></u><s></s></div>');
  while (cols.children.length > Math.min(6, page.length)) cols.lastChild.remove();
  page.slice(0, 6).forEach((item, i) => { cols.children[i].children[0].textContent = item.text; cols.children[i].children[1].textContent = item.name; });
  $('floorPage').textContent = page.length > 6 ? 'Page 1 of ' + Math.ceil(page.length / 6) : '';
}

// ---- the list you open on purpose: another model, or another capture ------------------------------------
let picking = null, pickedKind = '';                         // 'model' | 'capture'; the category shown
function openPicker(kind) {
  const block = current(); if (!block) return;
  picking = kind;
  pickedKind = kind === 'capture' || isNam(block) ? 'NAM' : model(block).category;
  $('pickerSearch').value = '';
  $('pickerSearch').hidden = kind === 'capture';
  $('pickerKinds').hidden = kind === 'capture';
  fillPicker();
  const picker = $('picker'); picker.classList.add('open'); picker.inert = false; scene.classList.add('picking');
  if (kind !== 'capture') setTimeout(() => $('pickerSearch').focus(), 60);
}
function closePicker() {
  if (!picking) return;
  picking = null;
  const picker = $('picker'); picker.classList.remove('open'); picker.inert = true; scene.classList.remove('picking');
}
function row(name, urls, note, isCurrent, choose) {
  const el = document.createElement('button');
  el.className = 'row' + (isCurrent ? ' cur' : '');
  el.innerHTML = '<img alt="" loading="lazy"><span></span><small></small>';
  const img = el.firstChild, list = (urls || []).slice().reverse();   // the small picture is plenty in a list
  img.onerror = () => { if (list.length) img.src = list.shift(); else img.style.visibility = 'hidden'; };
  if (list.length) img.src = list.shift(); else img.style.visibility = 'hidden';
  el.children[1].textContent = name; el.children[2].textContent = note || '';
  el.onclick = choose;
  return el;
}
function fillPicker() {
  const block = current(), rows = $('pickerRows'), kinds = $('pickerKinds');
  if (!block || !picking) return;
  const lists = catalog.lists || [], captures = state.captures || [];
  const query = picking === 'capture' ? '' : $('pickerSearch').value.trim().toLowerCase();
  $('pickerTitle').textContent = picking === 'capture' ? 'Captures on the Floor' : 'Change the model';
  kinds.textContent = '';
  if (picking === 'model') {
    for (const group of [...lists, {name: 'NAM', tint: [176, 112, 224]}]) {
      const chip = document.createElement('button');
      chip.textContent = group.name; chip.className = !query && group.name === pickedKind ? 'on' : '';
      chip.style.setProperty('--k', group.tint.join(' '));
      chip.onclick = () => { pickedKind = group.name; $('pickerSearch').value = ''; fillPicker(); rows.scrollTop = 0; };
      kinds.append(chip);
    }
  }
  rows.textContent = '';
  const taken = capture(block);
  const captureRows = () => captures.filter(c => !query || c.name.toLowerCase().includes(query)).map(c =>
    row(c.name, catalog.captures.pictures.map(url => url.replace('{icon}', encodeURIComponent(c.icon || ''))), query ? 'NAM' : 'slot ' + c.slot,
        !!taken && taken.slot === c.slot, () => { ask('capture', {dsp: block.dsp, id: block.id, slot: c.slot}); closePicker(); }));
  const modelRow = (symbol, note) => { const m = catalog.models[symbol];
    return row(m.name, m.pictures, note, symbol === block.model, () => { ask('model', {dsp: block.dsp, id: block.id, symbol}); closePicker(); }); };
  if (query) {                                                // a search looks through every model and capture
    const found = [];
    for (const group of lists) for (const folder of group.folders) for (const symbol of folder.models) {
      if (catalog.models[symbol].name.toLowerCase().includes(query)) found.push(modelRow(symbol, group.name + (folder.name ? ', ' + folder.name : '')));
    }
    found.push(...captureRows());
    rows.append(...found.slice(0, 80));
    if (!found.length) rows.innerHTML = '<p>Nothing matches that search.</p>';
  } else if (picking === 'capture' || pickedKind === 'NAM') {
    const list = captureRows();
    rows.append(...list);
    if (!list.length) rows.innerHTML = '<p>No capture on the Floor yet. Put one there from the NAM tab.</p>';
  } else {
    const group = lists.find(g => g.name === pickedKind) || lists[0];
    for (const folder of group ? group.folders : []) {
      if (group.folders.length > 1) { const h = document.createElement('h3'); h.textContent = folder.name; rows.append(h); }
      rows.append(...folder.models.map(symbol => modelRow(symbol, '')));
    }
  }
}

// ---- the top bar: preset, snapshot, undo, DSP ----------------------------------------------------------------
let dsp = null;
function drawBar() {
  const preset = state.preset, names = state.snapshots || [], on = state.snapshot;
  $('preset').hidden = !preset;
  if (preset) { $('presetNum').textContent = String(preset.number).padStart(3, '0'); $('presetName').textContent = preset.name || ''; }
  // The list is offered when HX Edit's own preset list could be read for this setlist; the arrows always.
  const listed = !!preset && Array.isArray(state.presets) && state.presets.length > 0;
  $('presetButton').disabled = !listed;
  $('presetButton').title = listed ? 'Choose a preset' : '';
  if (!listed) closePresets(); else if (!$('presetList').hidden) fillPresets();
  const has = Number.isInteger(on) && on >= 0 && on < names.length;
  $('snapButton').hidden = !has;
  if (has) { $('snapNum').textContent = on + 1; $('snapName').textContent = names[on] || 'Snapshot ' + (on + 1); }
  else closeSnapshots();
  $('undo').disabled = state.undo === false;
  if (!$('snapList').hidden) fillSnapshots();
}
function fillSnapshots() {
  const list = $('snapList'), names = state.snapshots || [];
  list.style.left = $('snapButton').offsetLeft + 'px';
  list.replaceChildren(...names.map((name, index) => {
    const row = document.createElement('button');
    row.className = index === state.snapshot ? 'cur' : '';
    row.innerHTML = '<span></span><span></span>';
    row.firstChild.textContent = index + 1; row.lastChild.textContent = name || 'Snapshot ' + (index + 1);
    row.onclick = () => { ask('snapshot', index); closeSnapshots(); };
    return row;
  }));
}
function closeSnapshots() { $('snapList').hidden = true; $('snapButton').setAttribute('aria-expanded', 'false'); }
let shownPresets = '';
function fillPresets() {
  // The loaded setlist's presets by number; redrawn only when a name or the loaded preset changes (it keeps its scroll).
  const list = $('presetList'), names = state.presets || [], at = state.preset ? state.preset.number : -1;
  const key = at + '\n' + names.join('\n');
  list.style.left = $('preset').offsetLeft + 'px';
  if (key === shownPresets && list.childElementCount === names.length) return;
  shownPresets = key;
  list.replaceChildren(...names.map((name, index) => {
    const row = document.createElement('button');
    row.className = index === at ? 'cur' : '';
    row.innerHTML = '<span></span><span></span>';
    row.firstChild.textContent = String(index).padStart(3, '0'); row.lastChild.textContent = name;
    row.onclick = () => { if (index !== at) ask('preset', index); closePresets(); };
    return row;
  }));
}
function openPresets() {
  closeSnapshots(); shownPresets = '';
  fillPresets();
  $('presetList').hidden = false; $('presetButton').setAttribute('aria-expanded', 'true');
  const current = $('presetList').querySelector('.cur');
  if (current) current.scrollIntoView({block: 'center'});
}
function closePresets() { $('presetList').hidden = true; $('presetButton').setAttribute('aria-expanded', 'false'); }
let toastTimer = 0;
function toast(text) {
  // Something asked for here did not happen (a preset that did not load, a model with no room on its DSP).
  const line = $('toast');
  line.textContent = String(text || ''); line.hidden = !line.textContent;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { line.hidden = true; }, 6000);
}
function drawDsp() {
  // Each DSP's blocks out of what they may use on the Floor (its own meter's figure), coloured as HX Edit Unbound's meter.
  $('dsp').replaceChildren(...(dsp || []).map((view, index) => {
    const el = document.createElement('div');
    if (!view || typeof view.used !== 'number') { el.hidden = true; return el; }
    el.className = view.level || '';
    el.innerHTML = '<span></span><i><b></b></i><span></span>';
    el.firstChild.textContent = 'DSP ' + (index + 1);
    el.querySelector('b').style.width = Math.min(100, 100 * view.used / view.budget) + '%';
    el.lastChild.textContent = view.used + '/' + view.budget;
    return el;
  }));
}

// ---- everything together ------------------------------------------------------------------------
function render() {
  if (!catalog || !state) return;
  const block = current();
  app.classList.toggle('empty', !block);
  $('hint').hidden = !!block;
  drawBar();
  drawChain();
  if (!block) {
    closePicker();
    $('hintText').textContent = state.blocks.length ? 'Select a block in the editor or on the Floor.' : 'Waiting for a preset from HX Edit.';
    app.classList.remove('off'); app.style.setProperty('--tint', '152 152 152');
    showScene(null); shownKey = ''; shownPicture = '';
    return;
  }
  const m = model(block), taken = capture(block);
  app.style.setProperty('--tint', m.tint.join(' '));
  app.classList.toggle('off', !block.enabled);
  $('cat').textContent = m.category || 'Block';
  $('modelName').textContent = m.name;
  $('captureButton').hidden = !taken; $('captureName').textContent = taken ? taken.name : '';
  $('modelButton').disabled = !/^block/.test(block.id);          // an input or an output is not a model to change
  if (picking) fillPicker();
  showScene(m.scene); showGear(block); drawDeck(block); drawFloor(block);
}
function receive(message) {
  if (!message || typeof message !== 'object') return;
  if (message.type === 'catalog') { catalog = message.catalog; shownKey = ''; shownPicture = ''; shownChain = ''; }
  else if (message.type === 'state') state = message.state;
  else if (message.type === 'dsp') { dsp = message.dsp; drawDsp(); return; }
  else if (message.type === 'notice') { toast(message.text); return; }
  else if (message.type === 'shown') { visible = message.shown === true; if (visible) place(); else { closePicker(); closeSnapshots(); closePresets(); $('toast').hidden = true; } return; }
  else return;
  render();
}
if (host) host.addEventListener('message', event => receive(event.data));
window.focusReceive = receive;                                  // (tests feed the page through this)

$('back').onclick = () => ask('exit');
$('undo').onclick = () => ask('undo');
$('redo').onclick = () => ask('redo');
$('snapButton').onclick = () => {
  const list = $('snapList');
  if (list.hidden) { closePresets(); fillSnapshots(); list.hidden = false; $('snapButton').setAttribute('aria-expanded', 'true'); } else closeSnapshots();
};
$('presetPrev').onclick = () => { closePresets(); ask('preset', 'previous'); };
$('presetNext').onclick = () => { closePresets(); ask('preset', 'next'); };
$('presetButton').onclick = () => $('presetList').hidden ? openPresets() : closePresets();
addEventListener('pointerdown', e => {
  if (!$('snapList').hidden && !e.target.closest('#snapList, #snapButton')) closeSnapshots();
  if (!$('presetList').hidden && !e.target.closest('#presetList, #presetButton')) closePresets();
});
$('modelButton').onclick = () => picking === 'model' ? closePicker() : openPicker('model');
$('captureButton').onclick = () => picking === 'capture' ? closePicker() : openPicker('capture');
$('pickerClose').onclick = closePicker;
$('pickerSearch').oninput = () => { fillPicker(); $('pickerRows').scrollTop = 0; };
scene.addEventListener('pointerdown', e => { if (picking && !e.target.closest('.picker')) closePicker(); });
$('floorToggle').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on); $('floor').classList.toggle('away', !on);
};
scene.addEventListener('pointermove', e => {
  const r = scene.getBoundingClientRect();
  scene.style.setProperty('--px', ((e.clientX - r.left) / r.width * 2 - 1).toFixed(3));
  scene.style.setProperty('--py', ((e.clientY - r.top) / r.height * 2 - 1).toFixed(3));
});
scene.addEventListener('pointerleave', () => { scene.style.setProperty('--px', 0); scene.style.setProperty('--py', 0); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !visible) return;
  if (!$('snapList').hidden) closeSnapshots();
  else if (!$('presetList').hidden) closePresets();
  else if (picking) closePicker(); else ask('exit');          // Escape closes a list first, then Focus Mode
});
addEventListener('resize', place);
</script>
</body>
