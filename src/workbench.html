<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<!--
  The Workbench (workbench.py serves it in the pane of focus_view.cs): a modern view of the regular editor, over HX
  Edit's own toolbar, signal flow and edit panel. It is Focus Mode's pane with another page, and speaks the same
  messages (focus_view.html has the list): {type: "catalog"} (Focus Mode's catalog plus each model's DSP cost
  "loads", the input and output names "inputs" / "outputs", and "captureTabs"), {type: "dspCosts"} (each model's DSP as
  the Floor's meter measured it, dsp_costs.py), {type: "state"} (focus_view.js's
  reading: the blocks with each input's and output's route and the split's and the mixer's settings, the preset,
  its snapshots, the tempo), {type: "dsp"}, {type: "notice"}, {type: "shown"}, {type: "options"} (the Unbound menu).
  It asks for the same things as Focus Mode ("select", "set", "model", "capture", "snapshot", "preset", "undo",
  "redo"), plus "save" (HX Edit's own Ctrl+S) and "menu" ("classic": HX Edit's own screen, "focus": Focus Mode, or a
  tool of the Unbound menu).
  The chain is drawn by workbench_layout.js; the controls turn as HX Edit's sliders do (pane_controls.js).
-->
<style>
  :root {
    --bg: #0c0d10; --panel: #14161b; --raise: #1c1f26; --raise2: #252933; --line: #2a2e38;
    --ink: #eceef2; --dim: #8d93a0; --faint: #5a606c; --unbound: #b070e0;
    --din: Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  img, canvas { -webkit-user-drag: none; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.25 var(--din); overflow: hidden;
               user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .pic { display: block; object-fit: contain; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c) / .9); flex: none; }
  .led.off { background: #3a3e48; box-shadow: none; }

  .app { height: 100%; display: grid; grid-template: 58px auto minmax(0, 1fr) / 68px auto minmax(0, 1fr); }
  .app > .top { grid-column: 1 / -1; }
  .app > .board { grid-column: 3; grid-row: 2; min-width: 0; } .app > .insp { grid-column: 3; grid-row: 3; min-width: 0; }

  /* ---- the library rail and its drawer ------------------------------------------------------------------- */
  .rail { grid-column: 1; grid-row: 2 / 4; border-right: 1px solid var(--line); background: var(--panel); display: grid; align-content: start; gap: 4px; padding: 10px 6px; }
  .rail button { display: grid; justify-items: center; gap: 4px; padding: 9px 0 7px; border-radius: 9px; color: var(--dim); font-size: 10.5px; }
  .rail button:hover { color: var(--ink); }
  .rail button svg { width: 20px; height: 20px; }
  .rail button.on { background: var(--raise2); color: var(--ink); }
  .rail button.un { color: var(--unbound); }
  .rail .sep { height: 1px; background: var(--line); margin: 6px 8px; }
  .drawer { grid-column: 2; grid-row: 2 / 4; width: 268px; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; min-height: 0; padding-top: 12px; }
  .drawer h3 { margin: 0 14px 8px; font-size: 17px; font-weight: 600; font-stretch: 86%; display: flex; justify-content: space-between; align-items: baseline; }
  .drawer h3 span { font-size: 12px; color: var(--dim); font-weight: 400; font-stretch: 100%; }
  .drawer .find { margin: 0 10px 8px; height: 32px; border-radius: 8px; background: var(--raise); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--faint); }
  .drawer .find svg { width: 14px; height: 14px; flex: none; }
  .drawer .find input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: inherit; }
  .kindchips { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 10px 6px; }
  .kindchips button { height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; }
  .kindchips button b { font-weight: 400; color: var(--faint); font-size: 11px; }
  .kindchips button.on { background: var(--raise2); color: var(--ink); border-color: #3a3f4b; }
  .caplist { overflow-y: auto; min-height: 0; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .caplist .grp { padding: 10px 14px 4px; color: var(--faint); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .caprow { width: calc(100% - 8px); display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 46px; padding: 0 12px 0 10px; margin: 0 4px;
            border-radius: 8px; text-align: left; touch-action: none; cursor: grab; }
  .caprow:hover { background: var(--raise); }
  .caprow img { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 3px 3px rgb(0 0 0 / .5)); }
  .caprow b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caprow small { color: var(--dim); font-size: 11.5px; }
  .caprow em { font-style: normal; color: var(--faint); font-size: 11.5px; }
  .caprow.on { background: rgb(176 112 224 / .16); box-shadow: inset 2px 0 0 #b070e0; } .caprow.on em { color: #c99cf0; }
  .caprow.lifted { opacity: .4; }
  .drawer .none { padding: 14px; color: var(--faint); font-size: 12.5px; line-height: 1.45; }
  .dfoot { border-top: 1px solid var(--line); padding: 10px 12px; color: var(--faint); font-size: 11.5px; line-height: 1.4; }
  /* a capture dragged onto the chain: the places it can go, and the NAM blocks whose capture it can take */
  .board.dragging.capture-drag .tile.nam-drop { box-shadow: 0 0 0 1px rgb(176 112 224 / .55); }
  .board.dragging.ir-drag .tile.ir-drop { box-shadow: 0 0 0 1px rgb(242 48 145 / .55); }
  .caprow .irwave, .ghost .irwave { width: 38px; height: 38px; display: grid; place-items: center; color: #f23091; }
  .caprow .irwave svg { width: 26px; height: 26px; } .ghost .irwave svg { width: 44px; height: 44px; }
  .board.dragging .tile.over { border-color: #f0c94a; box-shadow: 0 0 0 2px #f0c94a, 0 10px 30px rgb(240 201 74 / .25); }
  /* a drawer's expand button (to the thing's full view) */
  .xb { width: 24px; height: 24px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--dim); background: var(--raise); border: 1px solid var(--line); vertical-align: middle; margin-left: 6px; }
  .xb svg { width: 13px; height: 13px; } .xb:hover { border-color: #4a4f5b; color: var(--ink); }
  .drawer h3 span { display: inline-flex; align-items: center; }
  /* the Presets drawer: the loaded setlist's names */
  .prows { overflow-y: auto; min-height: 0; padding: 0 4px 8px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .prow { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; height: 29px; padding: 0 10px; border-radius: 7px; text-align: left; font-size: 13.5px; }
  .prow span:first-child { color: var(--faint); } .prow span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow:hover { background: var(--raise); }
  .prow.cur { background: var(--raise2); box-shadow: inset 2px 0 0 #f0c94a; } .prow.cur span:first-child { color: #f0c94a; }
  .prow.blank span:last-child { color: var(--faint); }

  /* ---- a tool in the lower half (in place of the block panel), and a full view (the whole work area) ------------- */
  .app.half > .insp { display: none; }
  .app.full > .drawer, .app.full > .board, .app.full > .insp, .app.full > .tool { display: none !important; }
  .tool { grid-column: 3; grid-row: 3; --c: 176 112 224; display: grid; grid-template-columns: 250px minmax(0, 1fr); min-width: 0; min-height: 0; }
  .tool .card .bigicon { width: 64px; height: 64px; margin: 10px auto 4px; color: rgb(var(--c)); }
  .tool .card .bigicon svg { width: 64px; height: 64px; }
  .tool .card .btnrow { flex-wrap: wrap; }
  .tbody { position: relative; min-width: 0; min-height: 0; }
  .vw { grid-column: 2 / -1; grid-row: 2 / 4; --c: 176 112 224; display: grid; grid-template-rows: 52px minmax(0, 1fr); min-width: 0; min-height: 0;
        background: radial-gradient(70% 60% at 50% 0%, #15181f 0%, var(--bg) 70%); }
  .vhead { display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--line); white-space: nowrap; min-width: 0; }
  .vhead h2 { margin: 0; font-size: 21px; font-weight: 600; font-stretch: 86%; }
  .vhead .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .vhead .sp { flex: 1; }
  .vbody { position: relative; min-width: 0; min-height: 0; }
  /* (behind a tool's own window until it is there, or if it does not come) */
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 14px; text-align: center; line-height: 1.5; padding: 20px; }
  /* the chain as small tiles in a full view's header: a click goes back to the chain with that block picked */
  .mini { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
  .mini small { color: var(--faint); font-size: 11px; margin: 0 5px 0 10px; }
  .mini button { width: 30px; height: 30px; border-radius: 7px; background: #15181e; border: 1px solid var(--line); border-bottom: 2px solid rgb(var(--c)); display: grid; place-items: center; flex: none; }
  .mini button:hover { border-color: #5a606c; border-bottom-color: rgb(var(--c)); }
  .mini button img { width: 22px; height: 22px; object-fit: contain; }
  .mini button.off { opacity: .4; }
  .mini button.on { box-shadow: 0 0 0 1px rgb(var(--c)); }
  .vw h5 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .note2 { color: var(--dim); font-size: 12.5px; line-height: 1.45; }
  .pinmark { color: #f0c94a; }

  /* ---- Presets, full: the whole setlist, two banks of four a row; the loaded preset on the right ------------------ */
  .pv { display: grid; grid-template-columns: minmax(0, 1fr) 316px; height: 100%; min-height: 0; }
  .pv .main { padding: 14px 20px 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; min-width: 0; }
  .pv .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .pv .head .search { width: 230px; height: 34px; }
  .pv .head .setname { font-size: 15px; font-weight: 600; }
  .pv .head .btn[aria-pressed=true] { background: var(--raise2); border-color: #4a5060; }
  .banks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: start; overflow-y: auto; min-height: 0; padding-bottom: 16px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .bank { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-content: start; }
  .pc { position: relative; height: 41px; border-radius: 8px; background: #15181e; border: 1px solid var(--line); padding: 0 9px; display: grid; align-content: center; line-height: 1.2; min-width: 0; text-align: left; }
  .pc:hover { border-color: #4a5060; }
  .pc small { font-size: 10.5px; color: var(--faint); }
  .pc b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
  .pc.blank { background: none; border-style: dashed; border-color: #20232b; }
  .pc.blank b { color: #474c57; font-weight: 400; } .pc.blank small { color: #3b3f49; }
  .pc.on { border-color: #b070e0; background: rgb(176 112 224 / .14); box-shadow: 0 0 0 1px #b070e0; }
  .pc.on small { color: #c99cf0; }
  .pc.hit { border-color: #f0c94a; }
  .pc .pin { position: absolute; right: 4px; top: 3px; width: 18px; height: 18px; display: grid; place-items: center; color: #f0c94a; border-radius: 5px; }
  .pc .pin svg { width: 11px; height: 11px; fill: currentColor; stroke: none; display: block; }
  .pc .pin.off { color: var(--faint); visibility: hidden; } .pc:hover .pin.off { visibility: visible; } .pc .pin.off:hover { color: #f0c94a; }
  .pd { border-left: 1px solid var(--line); padding: 16px 18px; display: grid; align-content: start; gap: 14px; overflow-y: auto; min-width: 0;
        background: linear-gradient(180deg, rgb(176 112 224 / .07), transparent 40%); }
  .pd h3 { margin: 2px 0 0; font-size: 22px; font-weight: 600; font-stretch: 86%; display: flex; gap: 8px; align-items: center; min-width: 0; }
  .pd h3 b { color: var(--dim); font-weight: 400; } .pd h3 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pd h3 u { width: 6px; height: 6px; border-radius: 50%; background: #f0c94a; flex: none; }
  .pd .mini { flex-wrap: wrap; row-gap: 6px; }
  .pd .mini small { margin: 0 6px 0 0; width: 100%; }
  .pd .dsps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; color: var(--dim); font-size: 12px; }
  .pd .dsps u { display: block; height: 4px; border-radius: 2px; background: #262a33; margin-top: 5px; position: relative; text-decoration: none; }
  .pd .dsps u i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: #f0c94a; }
  .snl { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .snl span { height: 26px; border-radius: 6px; background: #0e1014; border: 1px solid var(--line); display: flex; align-items: center; gap: 7px; padding: 0 9px; font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .snl span b { color: var(--faint); font-weight: 400; } .snl span.on { border-color: #4a5060; background: var(--raise2); } .snl span.on b { color: #f0c94a; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .acts .btn { justify-content: center; } .acts .wide { grid-column: 1 / -1; }
  .acts .btn svg.star { fill: currentColor; stroke: none; }
  .drop .pinned span:first-child { color: #f0c94a; }

  /* ---- Floor look: the scene behind each kind of block (Focus Mode's looks), lower half and full view ------------- */
  .lkhalf { padding: 12px 20px; display: grid; grid-template-rows: auto auto auto auto; gap: 10px; align-content: start; min-width: 0; min-height: 0; overflow-y: auto; }
  .lkrow { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .lkrow .sp { flex: 1; }
  .lkinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .lkind { position: relative; height: 62px; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); background: #000 center / cover no-repeat; text-align: left; }
  .lkind::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(0 0 0 / .8) 35%, rgb(0 0 0 / .25)); }
  .lkind img { position: absolute; right: 8px; top: 50%; width: 46px; height: 42px; object-fit: contain; transform: translateY(-50%); z-index: 1; filter: drop-shadow(0 5px 4px rgb(0 0 0 / .7)); }
  .lkind span { position: absolute; left: 9px; right: 56px; top: 50%; transform: translateY(-50%); z-index: 2; font-size: 12.5px; font-weight: 500; line-height: 1.25; }
  .lkind span em { display: block; font-style: normal; font-weight: 400; color: #aab0bc; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lkind:hover { border-color: #5a606c; }
  .lkind.on { border-color: #b070e0; box-shadow: 0 0 0 1px #b070e0; }
  .lkind.absent { opacity: .38; }
  .lkind .dot { position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: #f0c94a; z-index: 3; }
  .lkstrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .lkstrip button { flex: none; width: 92px; height: 46px; border-radius: 7px; border: 1px solid var(--line); background: #000 center / cover no-repeat; }
  .lkstrip button:hover { border-color: #5a606c; }
  .lkstrip button.on { border-color: #b070e0; box-shadow: 0 0 0 2px #b070e0; }
  .lkstrip button.def { border-color: rgb(240 201 74 / .6); }
  .lk { display: grid; grid-template-columns: minmax(520px, 676px) minmax(0, 1fr); height: 100%; min-height: 0; }
  .lk .left { padding: 16px 20px; display: grid; align-content: start; gap: 12px; border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .lk .right { padding: 16px 20px 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 12px; min-width: 0; min-height: 0; }
  .lcd { position: relative; width: 100%; height: 0; padding-bottom: 60%; border-radius: 14px; border: 1px solid #3a3f4b; background: #000 center / cover no-repeat; overflow: hidden;
         box-shadow: 0 0 0 6px #08090b, 0 24px 60px rgb(0 0 0 / .6); margin: 6px 0 8px; }
  .lcd::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgb(0 0 0 / .78)); }
  .lcd img { position: absolute; left: 50%; top: 46%; width: 60%; height: 55%; object-fit: contain; transform: translate(-50%, -50%); filter: drop-shadow(0 22px 14px rgb(0 0 0 / .7)); z-index: 1; }
  .lcd .cap { position: absolute; left: 20px; bottom: 16px; z-index: 2; line-height: 1.15; }
  .lcd .cap b { font-size: 26px; font-weight: 600; font-stretch: 86%; display: block; } .lcd .cap span { color: #ff8a4a; font-size: 13px; }
  .lcd .tag { position: absolute; right: 14px; top: 12px; z-index: 2; height: 22px; padding: 0 9px; border-radius: 11px; background: rgb(0 0 0 / .55); font-size: 11.5px; display: flex; align-items: center; color: #cfd3da; }
  .lkscenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-content: start; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .lkscene { position: relative; height: 112px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000 center / cover no-repeat; text-align: left; }
  .lkscene:hover { border-color: #5a606c; }
  .lkscene span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 9px 6px; font-size: 12px; background: linear-gradient(180deg, transparent, rgb(0 0 0 / .8)); display: flex; justify-content: space-between; gap: 6px; }
  .lkscene span em { font-style: normal; color: #aab0bc; font-size: 11px; white-space: nowrap; }
  .lkscene.on { border-color: #b070e0; box-shadow: 0 0 0 2px #b070e0; }
  .lkscene.def span em { color: #f0c94a; }
  .cpics { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; overflow: hidden; }
  .cpics img { width: 42px; height: 42px; object-fit: contain; flex: none; }
  .cpics div { margin-right: 6px; line-height: 1.3; flex: none; } .cpics div small { display: block; color: var(--dim); font-size: 11.5px; }
  .lk .bar { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); margin: 0 -20px; padding: 12px 20px; }
  .linkish { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }

  /* ---- Levels: the scan as a chart around the target (blue too quiet, orange too loud), lower half and full --------- */
  .lvl { display: grid; grid-template-columns: 304px minmax(0, 1fr); height: 100%; min-height: 0; }
  .lvl.half { grid-template-columns: minmax(0, 1fr); }
  .ls { border-right: 1px solid var(--line); padding: 16px 18px; display: grid; align-content: start; gap: 16px; overflow-y: auto; min-height: 0; }
  .sg { display: grid; gap: 7px; } .sg .seg2 { justify-self: start; }
  .sg .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lvpick { height: 32px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); color: var(--ink); font: inherit; padding: 0 8px; min-width: 0; }
  .numbox { height: 28px; width: 58px; padding: 0 8px; border-radius: 7px; background: #0e1014; border: 1px solid var(--line); color: var(--ink); font: inherit; text-align: center; }
  .lm { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
  .lm .lmhead { display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
  .lm .rows2 { padding: 0 20px 10px; align-content: start; display: grid; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .lax, .lrow, .lpre { display: grid; grid-template-columns: minmax(150px, 236px) minmax(0, 1fr) 70px 150px 112px; column-gap: 14px; align-items: center; }
  .lvl.half .lax, .lvl.half .lrow, .lvl.half .lpre { grid-template-columns: minmax(150px, 236px) minmax(0, 1fr) 70px 150px; }
  .lax { height: 44px; padding: 0 20px; color: var(--faint); font-size: 11.5px; border-bottom: 1px solid var(--line); }
  .lax .tr, .lrow .tr, .lpre .tr { position: relative; height: 100%; }
  .lax .tr span { position: absolute; bottom: 6px; transform: translateX(-50%); }
  .lax .tr .tgt { bottom: 21px; color: #eceef2; background: #2a2e38; border-radius: 5px; padding: 1px 7px; font-size: 11.5px; white-space: nowrap; }
  .tr .tl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgb(236 238 242 / .5); }
  .tr .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgb(255 255 255 / .05); }
  .lpre { min-height: 42px; margin-top: 4px; border-top: 1px solid rgb(255 255 255 / .05); }
  .lpre:first-child { border-top: 0; margin-top: 0; }

  /* a question asked before something is done (a scan that loads other presets, an Apply that saves, a recording) */

  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); white-space: nowrap; flex: none; }
  .chip.unbound { color: var(--unbound); }

  .chip svg { width: 15px; height: 15px; }
  .drop { position: absolute; top: 54px; z-index: 9; min-width: 240px; max-height: min(520px, 100vh - 70px); overflow-y: auto; padding: 6px; border-radius: 10px;
          background: #15171c; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgb(0 0 0 / .75); scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .drop button { width: 100%; display: grid; grid-template-columns: 38px 1fr; align-items: center; height: 29px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13.5px; }

  /* ---- the chain: two paths of eight places, lane B under lane A ------------------------------------------- */
  .board { position: relative; padding: 12px 14px 10px; display: grid; align-content: start; gap: 16px; min-width: 0;

  .tile.io.on { border-style: solid; }
  .slot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #101216; border: 1px dashed #4a505d; color: var(--faint);
          display: grid; place-items: center; font-size: 16px; line-height: 1; transition: transform .12s, border-color .12s, color .12s, background .12s; }

  /* while a block is dragged nothing opens: the places are faint dots, the one it would go to lights up */
  .board.dragging .slot.spot { color: transparent; border: 1.5px solid #6b7180; background: #101216; transform: scale(.5); opacity: .55; transition: transform .12s, opacity .12s; }
  .board.dragging .slot.spot.over { color: var(--ink); border-color: #f0c94a; background: rgb(240 201 74 / .2); transform: scale(1.45); opacity: 1; }

  /* under the lit place of a one-lane path: a dotted branch, the shape a split would take, ending in a small circle:

  /* (see-through, and more so over a place: the place it would go to shows under it) */

  .btn.danger:hover:not(:disabled) { border-color: #e2483c; color: #ff8a80; }

  .tabs button { padding: 0 2px 9px; color: var(--dim); font-size: 13.5px; }

  .tabs button:disabled { color: var(--faint); }
  /* stage 3: Bypass and controllers / Snapshot values (read-only for now) */

  .tabview .chip.on { border-color: rgb(var(--c)); background: rgb(var(--c) / .14); } .tabview .chip.none { background: none; border-style: dashed; color: var(--dim); }

  /* the split's type in its card: HX Edit's four, two by two */

  .seg.kinds button:hover:not(.on) { color: var(--ink); }

  .sgrid select.pick { width: 100%; min-width: 0; }

  .sgrid .hd { border-top: 0; display: grid; align-content: center; color: var(--dim); font-size: 12px; } .sgrid .hd b { color: var(--ink); font-size: 13px; }

</div>

<script>
'use strict';

  swap: svg('<path d="M3 5.5h9.5M10 3l2.5 2.5L10 8M13 10.5H3.5M6 8l-2.5 2.5L6 13"/>'),
  power: svg('<path d="M8 2v6"/><path d="M4.5 4.2a5 5 0 1 0 7 0"/>'),
  undo: svg('<path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h7a4 4 0 0 1 0 8H7"/>'),
  trash: svg('<path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9M6.7 7v4.5M9.3 7v4.5"/>'),
  search: svg('<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>'),
  split: svg('<path d="M2 8h4l4-4h4M6 8l4 4h4"/>'),
  mix: svg('<path d="M14 8h-4L6 4H2M10 8l-4 4H2"/>'),
  // an input or an output: a jack and its lead
  jack: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h8"/><rect x="12" y="12" width="10" height="8" rx="2"/><path d="M22 14.5h4.5M22 17.5h4.5"/><path d="M4 16c0-6 4-9 9-9"/></svg>',
};

// ---- which block, and what it is (as Focus Mode's page has it) -------------------------------------------------
const NEUTRAL = [152, 152, 152], NAM_TINT = [176, 112, 224];
const model = block => catalog.models[block.model] || {name: block.model, category: '', key: '', tint: NEUTRAL, pictures: [], params: []};

const isChain = block => /^block\d{1,2}$/.test(block.id);

}

  return (state.captures || []).find(c => c.slot === block.slot) || {slot: block.slot, name: 'IR slot ' + block.slot, icon: ''};
}
const captureUrls = c => c && c.icon ? catalog.captures.pictures.map(url => url.replace('{icon}', encodeURIComponent(c.icon))) : [];
function pictures(block) {
  const taken = capture(block);
  return taken && taken.icon ? captureUrls(taken).concat(model(block).pictures) : model(block).pictures;
}
const tint = block => isNam(block) ? NAM_TINT : model(block).tint || NEUTRAL;
function title(block) {
  const taken = capture(block);
  if (taken) return taken.name;
  const ir = irOn(block); if (ir) return ir.name;
  if (isEnd(block)) return endName(block) || model(block).name;
  return model(block).name;
}
// An IR block's IR, as the IRs drawer lists it (state.irs), or null
function irOn(block) {
  if (!/^HD2_ImpulseResponse/.test(block.model || '') || !Number.isInteger(block.slot)) return null;
  return (state.irs || []).find(i => i.slot === block.slot) || null;
}
// The IR Select control of the selected IR block: its slot and the IR's name, as HX Edit's own panel shows it
function slotLabel(v) {
  const block = current(), ir = block && irOn({...block, slot: Math.round(v)});
  return ir ? Math.round(v) + ': ' + ir.name : '';
}
function kindOf(block) {
  if (irOn(block)) return model(block).name;
  const taken = capture(block);
  if (taken) return 'gear' in taken ? namKind(taken) : model(block).name;
  if (block.id === 'split') return 'Split';
  if (block.id === 'join') return 'Mixer';
  if (isEnd(block)) return block.id.startsWith('input') ? 'Input' : 'Output';
  return model(block).category || '';
}
function endName(block) {
  if (block.id.startsWith('input')) return workbenchName(catalog.inputs, block.input);
  return workbenchName(catalog.outputs, block.output);
}
function current() {
  if (!state || !state.selected) return null;
  return state.blocks.find(b => b.dsp === state.selected.dsp && b.id === state.selected.id) || null;
}
// A picture that tries each of its addresses in turn (the large render first where asked, else the small one).
// A picture already showing is moved to where it is wanted, not loaded again (a redraw must not flash the pictures
// empty): drawChain and drawPanel gather their pictures first (reusable), image() takes one with the same addresses.
let reusable = null;
function gather(container) {
  const found = new Map();
  for (const img of container.querySelectorAll('img[data-pics]')) {
    if (!found.has(img.dataset.pics)) found.set(img.dataset.pics, []);
    found.get(img.dataset.pics).push(img);
  }
  return found;
}
function image(urls, cls, small, lazy) {
  const key = (small ? 's|' : 'l|') + (urls || []).join('|'), kept = reusable && reusable.get(key);
  if (kept && kept.length) { const img = kept.pop(); img.className = cls || ''; return img; }
  const img = el('img', cls), list = (urls || []).slice();
  img.dataset.pics = key;
  if (small) list.reverse();
  img.alt = ''; img.draggable = false;
  if (lazy) img.loading = 'lazy';                               // (only the picker's many cards wait until they are in view)
  img.onerror = () => { if (list.length) img.src = list.shift(); else img.style.visibility = 'hidden'; };
  if (list.length) img.src = list.shift(); else img.style.visibility = 'hidden';
  return img;
}

// ---- the chain --------------------------------------------------------------------------------------------------
const YA = 52, YB = 166, X0 = 74, R = 14;
let shownChain = '';
function geometry(width) {
  // Eight places between the input (left) and the output (right); a gap is where the split or the mixer sits.
  const end = Math.max(X0 + 8 * 90, width - 74), step = (end - X0) / 8, tile = Math.min(105, step - 18);
  return {width, end, step, tile, px: k => X0 + step * k + (step - tile) / 2, gap: k => X0 + step * k};
}
// A change to the chain asked for here, shown until HX Edit's reading has it (workbenchPending).
let pending = null, pendingTimer = 0;
const PENDING_MS = 3000;
function chainAsk(action, value) {
  const block = value.id ? state.blocks.find(b => b.dsp === value.dsp && b.id === value.id) : null;
  // (to the other path's lane B: pasted on its lane A first and moved down once the Floor has it, up to 4 s later)
  const wait = action === 'move' && value.to !== undefined && value.lane === 1 ? 6000 : PENDING_MS;
  pending = {action, ...value, block: block ? {...block} : null, until: Date.now() + wait};
  ask(action, value);
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { pending = null; if (catalog && state) drawChain(true); }, wait + 50);
  if (catalog && state) drawChain(true);
}
function shownBlocks() {
  if (pending && Date.now() > pending.until) pending = null;
  const view = workbenchPending(state.blocks, pending, catalog.nam[0]);
  if (view.settled) pending = null;
  return view.blocks;
}
const same = (a, b) => !!a && !!b && a.dsp === b.dsp && a.id === b.id;
function drawChain(force) {
  const board = $('board'), width = Math.max(800, board.clientWidth - 28 - 88);
  const paths = workbenchPaths(shownBlocks(), catalog, state.topology);
  const now = current();
  const key = JSON.stringify([width, paths.map(p => [p.a, p.b, p.from, p.to, p.split, p.join, p.inputB, p.outputB, p.input, p.output].map(x => JSON.stringify(x))),
                              now && [now.dsp, now.id], (state.captures || []).map(c => [c.slot, c.name, c.icon]), (state.irs || []).map(i => [i.slot, i.name]), dsp]);
  if (!force && key === shownChain) return;
  if (dragging) return;                                         // (redrawn when the drag ends)
  shownChain = key;
  reusable = gather(board);
  try { board.replaceChildren(...paths.map(p => drawPath(p, geometry(width), now))); } finally { reusable = null; }
}
function drawPath(p, g, now) {
  const two = !!p.b, out = [], wires = [`<path d="M32 ${YA}H${g.width - 32}"/>`];
  const tileOf = (block, place, y) => {
    const button = el('button', 'tile' + (block.enabled ? '' : ' off') + (same(block, now) ? ' on' : '') + (block.id === 'pending' ? ' coming' : ''));
    button.style.cssText = `--c:${tint(block).join(' ')};left:${g.px(place)}px;top:${y - 52}px;width:${g.tile}px`;
    button.dataset.dsp = p.dsp; button.dataset.lane = y === YA ? 0 : 1; button.dataset.place = place;   // (laneBranch)
    button.dataset.id = block.id; if (isNam(block)) button.classList.add('nam-drop'); if (isIr(block)) button.classList.add('ir-drop');   // (from a drawer)
    const led = el('span', 'led' + (block.enabled ? '' : ' off'));
    const strip = el('div', 'strip', title(block)); strip.append(el('small', '', kindOf(block)));
    button.append(led, image(pictures(block), 'pic', true), strip);
    button.title = title(block) + (capture(block) ? ' (' + model(block).name + ')' : '') + (block.enabled ? '' : ', bypassed');
    button.onclick = () => { if (!dragDone) pickBlock(block); };
    button.onpointerdown = event => liftBlock(event, block, button);
    return button;
  };
  const slot = (place, y, lane, offered) => {
    // An empty place: click to add a block here; while a block is dragged, a place it can go.
    const plus = el('button', 'slot spot' + (picking && picking.empty && picking.dsp === p.dsp && picking.lane === lane && picking.place === place ? ' picking' : ''), '+');
    plus.style.cssText = `left:${g.px(place) + g.tile / 2}px;top:${y}px` + (offered ? ';visibility:hidden' : '');
    plus.dataset.dsp = p.dsp; plus.dataset.lane = lane; plus.dataset.place = place;
    if (offered) plus.classList.add('offered');              // lane B on a path without one: shown only while dragging
    plus.title = 'Add a block here (Path ' + (p.dsp + 1) + ', lane ' + (lane ? 'B' : 'A') + ', place ' + (place + 1) + ')';
    plus.setAttribute('aria-label', plus.title);
    plus.onclick = () => openPlacePicker(p.dsp, lane, place);
    return plus;
  };

    const empty = el('div', 'lvempty'); empty.append(el('b', '', running ? 'Scanning…' : 'Nothing measured yet'));
    empty.append(full ? 'Choose the presets and snapshots on the left, then Scan. The amp stays silent: the Floor plays to USB only while it measures. Nothing changes until you Apply.'
                      : 'Scan measures this preset’s snapshots. The amp stays silent: the Floor plays to USB only while it measures. Nothing changes until you Apply. Full view scans a range of presets.');
    list.append(empty);
  }
  const legend = el('div', 'legend');
  for (const [color, words] of [['#3fb8ff', 'too quiet'], ['#f0a030', 'too loud']]) { const s = el('span'), dot = el('i'); dot.style.background = color; s.append(dot, words); legend.append(s); }
  { const s = el('span'), dot = el('i'); dot.style.cssText = 'background:none;border:2px solid #eceef2;width:7px;height:7px'; s.append(dot, 'after Apply'); legend.append(s); }
  const spacer = el('span'); spacer.style.flex = '1';
  const message = el('span', 'note2', levelText); message.style.maxWidth = '520px';
  const lm = el('div', 'lm'), headRow = el('div', 'lmhead');
  if (half) headRow.append(el('span', 'note2', 'Bring to'), targetPick, custom, metric);
  headRow.append(scan, cancel, progress);
  const bar = el('div', 'bar'); bar.append(message, spacer, legend, undo, apply);
  lm.append(headRow, axis, list, bar);
  if (full) {
    const side = el('aside', 'ls'), group = (title, ...items) => { const g = el('div', 'sg'); g.append(el('h5', '', title), ...items); return g; };
    const scope = seg([['current', 'This preset'], ['range', 'A range']], levelScope, value => { levelScope = value; shownLevels = ''; drawLevels(); });
    const range = el('div', 'line'), from = el('input', 'numbox'), to = el('input', 'numbox');
    from.dataset.id = 'from'; to.dataset.id = 'to';
    from.value = levelFrom ?? ''; to.value = levelTo ?? ''; from.disabled = to.disabled = !!running;
    from.onchange = () => { levelFrom = parseInt(from.value, 10); shownLevels = ''; drawLevels(); };
    to.onchange = () => { levelTo = parseInt(to.value, 10); shownLevels = ''; drawLevels(); };
    range.append(from, el('span', 'note2', 'to'), to, el('span', 'note2', state.preset && Number.isInteger(state.preset.setlist) ? 'in Setlist ' + (state.preset.setlist + 1) : ''));
    range.hidden = levelScope !== 'range';
    const guitarLine = el('div', 'line'); guitarLine.append(record, remove);
    const targetLine = el('div', 'line'); targetLine.append(targetPick, custom);
    side.append(group('Presets to scan', scope, range), group('Snapshots', snaps), group('What plays through them', guitarPick, guitarLine),
      group('Bring them to', targetLine, metric),
      el('span', 'note2', 'Silent while it measures: the Floor plays to USB only. Nothing changes until you Apply, and Apply only moves each output block’s Level. Cancel, or closing Levels, puts the presets back.'));
    box.append(side, lm);
  } else box.append(lm);
  body.replaceChildren(box);
  list.scrollTop = scroll;
  if (typing) { const again = body.querySelector('input[data-id="' + typing + '"]'); if (again) again.focus(); }
}
function libraryRow(kind, c, on) {
  const row = el('button', 'caprow' + (on ? ' on' : '')), [name, sub] = kind.words(c);
  const words = el('div'); words.append(el('b', '', name), el('small', '', sub));
  row.append(kind.picture(c), words, el('em', 'num', on ? 'in use' : 'slot ' + c.slot));
  row.title = name + ' (IR slot ' + c.slot + ')';
  row.onpointerdown = event => liftLibrary(event, kind, c, row);
  return row;
}
function putLibrary(kind, c) {
  // a click: on the selected block of the drawer's kind only (never turns another block into one of that kind)
  const block = current();
  if (!block || !isChain(block) || !kind.fits(block)) { toast(kind.select); return; }
  if (block.slot !== c.slot) kind.swap(block, c);
}
// A capture or an IR dragged from the drawer: onto an empty place (a block with it, where its path has room) or onto
// a block of its kind (swapped). As a block's drag, nothing opens while it is held.
function liftLibrary(event, kind, c, row) {
  if (event.button !== 0) return;
  const start = {x: event.clientX, y: event.clientY}, engine = {model: kind.model(), dsp: -1};
  let held = null, over = null;
  const board = $('board');
  const move = e => {
    if (!held) {
      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < 7) return;
      held = true; dragging = {library: c};
      board.classList.add('dragging', kind.drag); row.classList.add('lifted');
      for (const target of board.querySelectorAll('.slot.spot')) target.classList.toggle('off-path', !fitsOn(engine, Number(target.dataset.dsp)));
      const ghost = el('div', 'ghost'); ghost.style.setProperty('--c', kind.tint.join(' '));
      ghost.append(kind.picture(c));
      document.body.append(ghost); held = ghost;
    }
    held.style.left = (e.clientX - 46) + 'px'; held.style.top = (e.clientY - 46) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    let near = under && (under.closest('.tile.' + kind.tile) || under.closest('.slot.spot:not(.off-path)'));
    if (near && near.style.visibility === 'hidden') near = null;
    let best = Infinity;
    if (!near) for (const slot of board.querySelectorAll('.slot.spot:not(.off-path)')) {
      if (slot.style.visibility === 'hidden') continue;
      const r = slot.getBoundingClientRect(), dx = Math.abs(e.clientX - (r.left + r.width / 2)), dy = Math.abs(e.clientY - (r.top + r.height / 2));
      if (dx < 44 && dy < 44 && dx * dx + dy * dy < best) { best = dx * dx + dy * dy; near = slot; }
    }
    if (over !== near) { if (over) over.classList.remove('over'); over = near || null; if (near) near.classList.add('over'); }
    held.classList.toggle('aimed', !!near);
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    if (!held) { putLibrary(kind, c); return; }                  // (not moved: a click)
    held.remove(); row.classList.remove('lifted');
    if (over) over.classList.remove('over');
    board.classList.remove('dragging', kind.drag);
    dragging = null;
    if (over && over.classList.contains('tile')) {
      const block = state.blocks.find(b => b.dsp === Number(over.dataset.dsp) && b.id === over.dataset.id);
      if (block && kind.fits(block) && block.slot !== c.slot) kind.swap(block, c);
    } else if (over) kind.add({dsp: Number(over.dataset.dsp), lane: Number(over.dataset.lane), place: Number(over.dataset.place)}, c);
    drawChain(true);
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
}

// ---- everything together -----------------------------------------------------------------------------------------
// Redo: worked out from HX Edit's undo position as it changes (workbenchRedo); a redo asked for here is one.
let redoTrack = null, redoAskedAt = 0;
function render() {
  if (!catalog || !state) return;
  const preset = state.preset ? state.preset.setlist + ':' + state.preset.number : '';
  redoTrack = workbenchRedo(redoTrack, state.undoAt, preset, Date.now() - redoAskedAt < 3000);
  drawBar();
  drawRail();
  drawDrawer();
  if (!view.full) { drawChain(); drawPanel(); } else { drawMini(); if (view.full === 'presets') drawPresetGrid(); }
  drawLook(); drawLevels();
}
function receive(message) {
  if (!message || typeof message !== 'object') return;
  if (message.type === 'catalog') { catalog = message.catalog; shownChain = ''; shownPanel = ''; }
  else if (message.type === 'state') {
    const before = state && state.preset ? state.preset.setlist + ':' + state.preset.number : '', undoBefore = state && state.undoAt;
    state = message.state;
    const after = state && state.preset ? state.preset.setlist + ':' + state.preset.number : '';
    if (before !== after) snapGroup = null;
    // (values set in other snapshots are shown as set until HX Edit's own record agrees: forgotten on another preset
    // or an undo)
    if (before !== after || (typeof undoBefore === 'number' && typeof state.undoAt === 'number' && state.undoAt < undoBefore)) snapHeld.clear();
    if (picking && picking.block && !(current() && isChain(current()))) picking = false;
    if (picking && picking.empty && state.blocks.some(b => b.dsp === picking.dsp && /^block/.test(b.id) && b.position === picking.place && b.path === picking.lane)) picking = false;
  }
  else if (message.type === 'dsp') { dsp = message.dsp; shownChain = ''; }
  else if (message.type === 'dspCosts') { costs = message.costs && typeof message.costs === 'object' ? message.costs : {}; shownPanel = ''; }
  else if (message.type === 'options') { options = message.options || {}; drawRail(); return; }
  else if (message.type === 'notice') { toast(message.text); if (snapHeld.size) { snapHeld.clear(); shownPanel = ''; render(); } return; }   // (a change refused: shown as it is)
  else if (message.type === 'shown') {
    // (hidden, a tool's window goes back over HX Edit's own panel: shown again, it is placed over its frame again)
    visible = message.shown === true; toolShown = '';
    if (!visible) { closePresets(); closeMenu(); $('toast').hidden = true; } else { render(); syncTool(); syncLevels(); }
    return;
  }
  else if (message.type === 'toolClosed') { toolClosed(); return; }
  else if (message.type === 'session') { levelSessionMessage(message.kind, message.data || {}); return; }
  else if (message.type === 'prefs') {
    const kept = message.prefs && message.prefs.levels;
    if (kept && typeof kept === 'object') { levelPrefs = {...levelPrefs, ...kept, offsets: kept.offsets && typeof kept.offsets === 'object' ? kept.offsets : {}}; shownLevels = ''; drawLevels(); }
    return;
  }
  else if (message.type === 'look') { look = message.look && typeof message.look === 'object' ? message.look : null; shownLook = ''; }
  else if (message.type === 'pins') { pins = Array.isArray(message.pins) ? message.pins.filter(k => typeof k === 'string') : []; shownGrid = ''; shownDrawer = ''; shownPresets = ''; if (!$('presetList').hidden) fillPresets(); }
  else return;
  render();
}
if (host) host.addEventListener('message', event => receive(event.data));
addEventListener('dragstart', event => event.preventDefault());
window.workbenchReceive = receive;                              // (tests and the preview feed the page through this)
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="kg" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#4a4f5b"/><stop offset=".55" stop-color="#23262e"/><stop offset="1" stop-color="#15171c"/></radialGradient></defs></svg>');

$('undo').onclick = () => ask('undo');
$('redo').onclick = () => { redoAskedAt = Date.now(); ask('redo'); };
$('save').onclick = () => ask('save');
$('toFocus').onclick = () => ask('menu', 'focus');
$('presetPrev').onclick = () => { closePresets(); ask('preset', 'previous'); };
$('presetNext').onclick = () => { closePresets(); ask('preset', 'next'); };
$('presetButton').onclick = () => $('presetList').hidden ? openPresets() : closePresets();
$('menuButton').onclick = () => $('menu').hidden ? openMenu() : closeMenu();
addEventListener('pointerdown', e => {
  if (!$('presetList').hidden && !e.target.closest('#presetList, #presetButton')) closePresets();
  if (!$('menu').hidden && !e.target.closest('#menu, #menuButton')) closeMenu();
});
addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && visible && !e.target.closest('input')) {
    const block = current();
    if (block && isChain(block)) { e.preventDefault(); removeBlock(block); }
    return;
  }
  if (e.key !== 'Escape' || !visible) return;
  if (!$('presetList').hidden) closePresets(); else if (!$('menu').hidden) closeMenu(); else if (picking && !view.full) closePicker();
  else if (view.full || view.half) setView('escape');
});
drawRail(); drawDrawer();
let resizing = 0;
addEventListener('resize', () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(() => { if (catalog && state && !view.full) drawChain(); syncTool(); }); });
</script>
