<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<!--
  The Workbench (workbench.py serves it in the pane of focus_view.cs): a modern view of the regular editor, over HX
  Edit's own toolbar, signal flow and edit panel. It is Focus Mode's pane with another page, and speaks the same
  messages (focus_view.html has the list): {type: "catalog"} (Focus Mode's catalog plus each model's DSP cost
  "loads", the input and output names "inputs" / "outputs", and "captureTabs"), {type: "dspCosts"} (each model's DSP as
  the Floor's meter measured it, dsp_costs.py), {type: "state"} (focus_view.js's
  reading: the blocks with each input's and output's route and the split's and the mixer's settings, the preset,
  its snapshots, the tempo), {type: "dsp"}, {type: "notice"}, {type: "shown"}, {type: "options"} (the Unbound menu).
  It asks for the same things as Focus Mode ("select", "set", "model", "capture", "snapshot", "preset", "undo",
  "redo"), plus "save" (HX Edit's own Ctrl+S) and "menu" ("classic": HX Edit's own screen, "focus": Focus Mode, or a
  tool of the Unbound menu).
  The chain is drawn by workbench_layout.js; the controls turn as HX Edit's sliders do (pane_controls.js).
-->
<style>
  :root {
    --bg: #0c0d10; --panel: #14161b; --raise: #1c1f26; --raise2: #252933; --line: #2a2e38;
    --ink: #eceef2; --dim: #8d93a0; --faint: #5a606c; --unbound: #b070e0;
    --din: Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  img, canvas { -webkit-user-drag: none; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.25 var(--din); overflow: hidden;
               user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .pic { display: block; object-fit: contain; }
  .led { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c) / .9); flex: none; }
  .led.off { background: #3a3e48; box-shadow: none; }

  .app { height: 100%; display: grid; grid-template-rows: 58px auto minmax(0, 1fr); }

  /* ---- the top bar ------------------------------------------------------------------------------------- */
  .top { position: relative; z-index: 6; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 0; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .logo { width: 68px; height: 100%; display: grid; place-items: center; flex: none; }
  .logo i { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2b3350, #151a2c); display: grid; place-items: center; font-style: normal; font-weight: 700; color: #cfd6ff; font-size: 17px; }
  .now { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .now .step { width: 22px; height: 34px; border-radius: 6px; color: var(--faint); display: grid; place-items: center; flex: none; }
  .now .step:hover { color: var(--ink); background: var(--raise); }
  .now .step svg { width: 11px; height: 11px; }
  .preset { display: grid; line-height: 1.15; text-align: left; padding: 2px 6px; border-radius: 7px; min-width: 0; }
  .preset:hover:not(:disabled) { background: var(--raise); }
  .preset small { color: var(--dim); font-size: 11.5px; }
  .preset strong { font-size: 19px; font-weight: 600; font-stretch: 86%; display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
  .preset strong span { overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .preset strong b { color: var(--dim); font-weight: 400; }
  .preset strong i { width: 6px; height: 6px; border-radius: 50%; background: #f0c94a; flex: none; }
  .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--raise); border: 1px solid var(--line); color: var(--dim); flex: none; }
  .icon:hover:not(:disabled) { color: var(--ink); border-color: #4a5060; }
  .icon:disabled { opacity: .45; }
  .icon svg { width: 15px; height: 15px; }
  .snaps { display: flex; gap: 4px; background: #0e1014; border: 1px solid var(--line); padding: 3px; border-radius: 9px; min-width: 0; }
  .snaps button { height: 28px; padding: 0 12px; border-radius: 6px; color: var(--dim); display: flex; gap: 7px; align-items: center; white-space: nowrap; max-width: 150px; }
  .snaps button span { overflow: hidden; text-overflow: ellipsis; }
  .snaps button b { font-weight: 400; color: var(--faint); }
  .snaps button:hover { color: var(--ink); }
  .snaps button.on { background: var(--raise2); color: var(--ink); } .snaps button.on b { color: #f0c94a; }
  .pair { display: flex; gap: 6px; }
  .grow { flex: 1; }
  .tempo { height: 34px; padding: 0 10px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); display: grid; place-items: center; line-height: 1; font-size: 15px; }
  .tempo small { color: var(--dim); font-size: 10.5px; }
  .view { display: flex; background: #0e1014; border: 1px solid var(--line); padding: 3px; border-radius: 9px; flex: none; }
  .view button { height: 28px; padding: 0 14px; border-radius: 6px; color: var(--dim); }
  .view button:hover { color: var(--ink); }
  .view button.on { background: var(--ink); color: #111; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); white-space: nowrap; flex: none; }
  .chip.unbound { color: var(--unbound); }
  .chip.unbound:hover, .chip.unbound[aria-expanded=true] { border-color: rgb(176 112 224 / .6); }
  .chip svg { width: 15px; height: 15px; }
  .drop { position: absolute; top: 54px; z-index: 9; min-width: 240px; max-height: min(520px, 100vh - 70px); overflow-y: auto; padding: 6px; border-radius: 10px;
          background: #15171c; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgb(0 0 0 / .75); scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .drop button { width: 100%; display: grid; grid-template-columns: 38px 1fr; align-items: center; height: 29px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13.5px; }
  .drop button span:first-child { color: var(--faint); }
  .drop button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop button:hover { background: var(--raise2); }
  .drop button.cur { background: var(--raise2); box-shadow: inset 2px 0 0 #f0c94a; }
  .drop.menu { right: 16px; width: 300px; }
  .drop.menu button { grid-template-columns: 1fr; height: auto; padding: 7px 10px; }
  .drop.menu button span:first-child, .drop.menu button span:last-child { color: var(--ink); white-space: normal; }
  .drop.menu button small { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; }
  .drop.menu h6 { margin: 8px 10px 4px; font-size: 11px; font-weight: 500; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
  .drop.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .toast { position: absolute; left: 50%; top: 66px; z-index: 10; transform: translateX(-50%); max-width: 600px; padding: 10px 16px; border-radius: 10px;
           background: #15171c; box-shadow: 0 0 0 1px #3a3f4b, 0 18px 40px rgb(0 0 0 / .7); font-size: 14px; line-height: 1.35; text-align: center; }

  /* ---- the chain: two paths of eight places, lane B under lane A ------------------------------------------- */
  .board { position: relative; padding: 12px 14px 10px; display: grid; align-content: start; gap: 16px; min-width: 0;
           background: radial-gradient(90% 120% at 50% 100%, #1a1d25 0%, var(--bg) 75%); border-bottom: 1px solid var(--line); }
  .path { display: flex; align-items: flex-start; min-width: 0; }
  .path .tag { width: 88px; height: 104px; flex: none; display: grid; gap: 5px; align-content: center; }
  .path .tag b { font-weight: 600; font-size: 13px; }
  .path .tag small { color: var(--dim); font-size: 11.5px; }
  .meter { width: 66px; height: 5px; border-radius: 3px; background: #262a33; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #2fae5c, #3fc56b); }
  .meter.yellow i { background: linear-gradient(90deg, #d9b23c, #f0c94a); } .meter.red i { background: linear-gradient(90deg, #d23a30, #e2483c); }
  .grid8 { position: relative; flex: 1; min-width: 0; }
  .grid8 > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .grid8 > svg path { fill: none; stroke: #414754; stroke-width: 2; }
  .grid8 > svg path.b { stroke: #565d6d; }
  .tile { position: absolute; height: 104px; border-radius: 11px; background: #15181e; border: 1px solid var(--line); display: grid; grid-template-rows: 1fr auto;
          justify-items: center; padding: 7px 5px 0; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  button.tile:hover { border-color: rgb(var(--c) / .7); }
  .tile .pic { width: 56px; height: 56px; filter: drop-shadow(0 7px 6px rgb(0 0 0 / .6)); }
  .tile .strip { width: calc(100% + 10px); margin: 4px -5px 0; padding: 4px 4px 5px; background: #0b0c0f; border-top: 2px solid rgb(var(--c)); text-align: center;
                 font-size: 12px; font-stretch: 88%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .strip small { display: block; font-size: 10.5px; color: rgb(var(--c)); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
  .tile.coming { pointer-events: none; opacity: .85; }
  .tile.off .pic { filter: grayscale(.9) brightness(.45); } .tile.off .strip { border-top-color: #3a3e48; color: var(--faint); } .tile.off .strip small { color: var(--faint); }
  .tile.on { border-color: rgb(var(--c)); box-shadow: 0 0 0 1px rgb(var(--c)), 0 10px 30px rgb(var(--c) / .22); background: linear-gradient(#1b1e26, #15181e); }
  .tile .led { position: absolute; top: 7px; left: 7px; }
  .tile.io { width: 64px; height: 80px; background: #101216; border-style: dashed; padding: 10px 2px 0; }
  .tile.io svg { width: 32px; height: 32px; color: #9aa1ae; }
  .tile.io .strip { background: none; border-top-color: transparent; color: var(--dim); font-size: 11px; width: 100%; margin: 0; padding: 2px 0 6px; }
  .tile.io.on { border-style: solid; }
  .slot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #101216; border: 1px dashed #4a505d; color: var(--faint);
          display: grid; place-items: center; font-size: 16px; line-height: 1; transition: transform .12s, border-color .12s, color .12s, background .12s; }
  .slot:hover { color: var(--ink); border-color: #8d93a0; border-style: solid; }
  .slot.picking { color: var(--ink); border: 1.5px solid #f0c94a; background: rgb(240 201 74 / .12); }
  /* while a block is dragged nothing opens: the places are faint dots, the one it would go to lights up */
  .board.dragging .slot.spot { color: transparent; border: 1.5px solid #6b7180; background: #101216; transform: scale(.5); opacity: .55; transition: transform .12s, opacity .12s; }
  .board.dragging .slot.spot.over { color: var(--ink); border-color: #f0c94a; background: rgb(240 201 74 / .2); transform: scale(1.45); opacity: 1; }
  .board.dragging .slot.off-path { opacity: .12; }
  /* under the lit place of a one-lane path: a dotted branch, the shape a split would take, ending in a small circle:
     dropped there, the block goes on a parallel lane (lane B) at that place */
  .lane-branch { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  .lane-branch.behind { z-index: auto; }
  .lane-branch path { fill: none; stroke: #9a80ff; stroke-width: 1.6; stroke-dasharray: 4 5; opacity: .85; }
  .board.dragging .slot.spot.lane-drop { z-index: 2; color: #9a80ff; border-color: #9a80ff; transform: scale(.8); opacity: .95; }
  .board.dragging .slot.spot.lane-drop.over { color: var(--ink); border-color: #f0c94a; background: rgb(240 201 74 / .2); transform: scale(1.35); opacity: 1; }
  .board.dragging .tile.lifted { opacity: .35; }
  .laneb-hint { position: absolute; left: 70px; right: 70px; height: 0; border-top: 2px dashed #3a3f4b; }
  .ghost { position: fixed; z-index: 20; pointer-events: none; width: 92px; height: 92px; border-radius: 11px; background: #1b1e26; border: 1px solid rgb(var(--c));
           box-shadow: 0 16px 40px rgb(0 0 0 / .6); display: grid; place-items: center; transform: rotate(-2deg); opacity: .78; }
  /* (see-through, and more so over a place: the place it would go to shows under it) */
  .ghost.aimed { opacity: .38; }
  .ghost img { width: 60px; height: 60px; object-fit: contain; }
  .btn.danger:hover:not(:disabled) { border-color: #e2483c; color: #ff8a80; }
  .pcats button.remove { color: var(--faint); }
  .pcats button.remove:hover { color: #ff8a80; }
  .card .pic.place { display: grid; place-items: center; font-size: 64px; color: var(--faint); border: 2px dashed #3a3f4b; border-radius: 18px; width: 110px; height: 110px; }
  .node { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #20242d; border: 1.5px solid #7b8394; color: var(--ink);
          display: grid; place-items: center; box-shadow: 0 4px 12px rgb(0 0 0 / .5); }
  .node svg { width: 16px; height: 16px; }
  /* the split and the mixer slide along lane A: the gaps they may go to show while one is held */
  .node.movable { cursor: grab; z-index: 3; transition: left .12s; } .node.movable:hover { border-color: #f0c94a; }
  .node.on { border-color: #f0c94a; background: #2a2a22; box-shadow: 0 0 0 1px #f0c94a, 0 6px 18px rgb(240 201 74 / .25); }
  .node.held { cursor: grabbing; transition: none; border-color: #f0c94a; box-shadow: 0 0 0 4px rgb(240 201 74 / .18), 0 4px 12px rgb(0 0 0 / .5); }
  .gap-drop { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 1.5px solid #6b7180; background: #101216;
              opacity: .7; pointer-events: none; z-index: 2; transition: transform .12s, border-color .12s; }
  .gap-drop.over { border-color: #f0c94a; background: rgb(240 201 74 / .25); transform: scale(1.5); opacity: 1; }
  .note { position: absolute; display: grid; gap: 1px; line-height: 1.2; white-space: nowrap; margin-top: -16px; }
  .note b { font-weight: 600; font-size: 12.5px; } .note small { color: var(--dim); font-size: 11.5px; }
  .note.r { text-align: right; }

  /* ---- the panel under the chain: the selected block --------------------------------------------------------- */
  .insp { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 0; }
  .insp.nam { grid-template-columns: 250px minmax(0, 1fr) 316px; }
  .insp.pick { grid-template-columns: 250px 176px minmax(0, 1fr); }
  .card { padding: 18px 18px 14px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 12px; min-height: 0;
          background: linear-gradient(180deg, rgb(var(--c) / .10), transparent 55%); }
  .card .pic { width: 150px; height: 150px; margin: 0 auto; filter: drop-shadow(0 16px 14px rgb(0 0 0 / .6)); }
  .card .pic.io { width: 90px; height: 90px; color: #9aa1ae; }
  .card h4 { margin: 0; font-size: 24px; font-weight: 600; font-stretch: 80%; line-height: 1.05; overflow-wrap: anywhere; }
  .card p { margin: 4px 0 0; color: rgb(var(--c)); display: flex; gap: 8px; align-items: center; }
  .card .hint { color: var(--dim); font-size: 12.5px; line-height: 1.4; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: #4a5060; }
  .btn:disabled { opacity: .45; }
  .btn.pri { background: rgb(var(--c) / .18); border-color: rgb(var(--c) / .55); }
  .btn.pri:hover:not(:disabled) { border-color: rgb(var(--c)); }
  .btn svg { width: 14px; height: 14px; }
  .btn.power[aria-pressed=true] { color: rgb(var(--c)); }
  .btn.power[aria-pressed=false] { color: var(--faint); }
  .ctl { padding: 0 22px; display: grid; grid-template-rows: 44px minmax(0, 1fr); min-width: 0; min-height: 0; }
  .tabs { display: flex; gap: 22px; padding: 0 6px; align-items: end; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 0 2px 9px; color: var(--dim); font-size: 13.5px; }
  .tabs button.on { color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
  .tabs button:disabled { color: var(--faint); }
  /* stage 3: Bypass and controllers / Snapshot values (read-only for now) */
  .tabview { padding: 14px 6px; display: grid; align-content: start; gap: 12px; overflow-y: auto; min-height: 0; }
  .tabview .strip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .tabview .chip { height: 26px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; background: var(--raise2); border: 1px solid #3a3f4b; }
  .tabview .chip.on { border-color: rgb(var(--c)); background: rgb(var(--c) / .14); } .tabview .chip.none { background: none; border-style: dashed; color: var(--dim); }
  .tabview table { border-collapse: collapse; width: 100%; }
  .tabview th { text-align: left; font-weight: 400; color: var(--faint); font-size: 12px; padding: 0 10px 6px; }
  .tabview td { padding: 7px 10px; border-top: 1px solid #1d2027; } .tabview td.name { font-weight: 600; } .tabview td.now { color: rgb(var(--c)); } .tabview td.dim { color: var(--faint); }
  .tabview .tabnote { color: var(--faint); font-size: 12px; margin: 0; }
  .tabview .pick, .sgrid .pick { height: 28px; border-radius: 7px; background: var(--raise2); border: 1px solid #3a3f4b; color: var(--ink); font: inherit; padding: 0 8px; }
  .tabview input.pick { width: 170px; } .tabview select.pick { max-width: 190px; }
  .tabview .seg { display: inline-flex; border: 1px solid #3a3f4b; border-radius: 7px; overflow: hidden; }
  .tabview .seg button { padding: 5px 10px; color: var(--dim); } .tabview .seg button.on { background: var(--raise2); color: var(--ink); }
  .tabview td input.range { width: 110px; vertical-align: middle; margin-right: 8px; accent-color: rgb(var(--c)); }
  .sgrid input.range { flex: 1; min-width: 40px; margin-right: 6px; accent-color: rgb(var(--c)); }
  .sgrid > div { flex-wrap: nowrap; } .sgrid > div.num > span { flex: none; width: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sgrid select.pick { width: 100%; min-width: 0; }
  .sgrid .dotb { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgb(var(--c)); }
  .sgrid .dotb.on { background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c) / .7); }
  .sgrid .cellb { height: 24px; padding: 0 9px; border-radius: 6px; border: 1px solid #3a3f4b; background: #0f1115; }
  .sgrid { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .sgrid > div { padding: 0 12px; min-height: 38px; display: flex; align-items: center; border-top: 1px solid #1d2027; }
  .sgrid .hd { border-top: 0; display: grid; align-content: center; color: var(--dim); font-size: 12px; } .sgrid .hd b { color: var(--ink); font-size: 13px; }
  .sgrid .cur { background: rgb(var(--c) / .1); }
  .sgrid .name.moved { color: rgb(var(--c)); } .sgrid .name.fixed { color: var(--faint); font-weight: 500; }
  .sgrid .fixedline { gap: 10px; color: var(--faint); background: rgb(0 0 0 / .18); } .sgrid .fixedline .same { white-space: nowrap; }
  .sgrid .hd.pickable:not(.cur) { cursor: pointer; } .sgrid .hd.pickable:not(.cur):hover { background: var(--raise2); } .sgrid .hd.pickable:not(.cur):hover b { color: rgb(var(--c)); } .sgrid .name { font-weight: 600; }
  .knobs { display: flex; flex-wrap: wrap; gap: 22px 6px; align-content: center; justify-content: center; padding: 14px 0; overflow-y: auto; min-height: 0;
           scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .knobs.s { gap: 14px 2px; }
  .knob { width: 86px; display: grid; justify-items: center; gap: 2px; position: relative; text-align: center; }
  .knob .dial { width: 80px; height: 80px; cursor: ns-resize; touch-action: none; border-radius: 50%; display: block; }
  .knobs.s .knob { width: 78px; } .knobs.s .knob .dial { width: 66px; height: 66px; }
  .knob .dial svg { width: 100%; height: 100%; overflow: visible; }
  .knob .val { font-size: 16px; color: rgb(var(--c)); margin-top: -4px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 20px; }
  .knobs.s .knob .val { font-size: 14px; }
  .knob .nm { color: var(--ink); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .knob.live .val { color: #fff; }
  .insp.off .knob .val, .insp.off .sw .val { color: var(--dim); }
  .sync { position: absolute; top: -6px; right: 0; height: 18px; padding: 0 7px; border-radius: 9px; font-size: 11px; line-height: 18px; color: var(--dim);
          background: #0b0c0f; box-shadow: inset 0 0 0 1px var(--line); }
  .sync.on { color: #111; background: rgb(var(--c)); box-shadow: none; }
  .sw { width: 86px; display: grid; justify-items: center; gap: 2px; align-content: end; text-align: center; }
  .sw .lever { width: 54px; height: 28px; border-radius: 14px; background: #0b0c0f; border: 1px solid var(--line); position: relative; margin: 26px 0; transition: background .15s; }

           scrollbar-width: thin; scrollbar-color: #444 transparent; }
  .cards h6 { grid-column: 1 / -1; margin: 6px 2px 0; font-size: 12px; font-weight: 500; color: var(--dim); }

        grid-template-rows: 1fr auto; justify-items: center; padding: 8px 8px 7px; min-width: 0; text-align: center; }

  <section class="board" id="board" aria-label="Signal chain"></section>

  <section class="insp" id="insp" aria-label="The selected block"></section>
</div>

<script src="pane_controls.js"></script>
<script src="workbench_layout.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const host = window.chrome && window.chrome.webview;
let catalog = null, state = null, dsp = null, options = {}, visible = !host;
let costs = {};          // each model's DSP as the Floor's meter measured it ({type: "dspCosts"}, workbench.py)
// A model's DSP: as measured on the Floor where it has been, else HX Edit's estimate (catalog.loads). NaN: unknown.
const costOf = symbol => { const found = Number(costs[symbol]); return Number.isFinite(found) && found > 0 ? found : Number((catalog && catalog.loads || {})[symbol]); };
const ask = (name, value) => { if (host) host.postMessage(JSON.stringify({name, value: value === undefined ? null : value})); };
const el = (tag, cls, words) => { const node = document.createElement(tag); if (cls) node.className = cls; if (words !== undefined) node.textContent = words; return node; };
const svg = inner => '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
const ICON = {
  swap: svg('<path d="M3 5.5h9.5M10 3l2.5 2.5L10 8M13 10.5H3.5M6 8l-2.5 2.5L6 13"/>'),
  power: svg('<path d="M8 2v6"/><path d="M4.5 4.2a5 5 0 1 0 7 0"/>'),
  undo: svg('<path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h7a4 4 0 0 1 0 8H7"/>'),
  trash: svg('<path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9M6.7 7v4.5M9.3 7v4.5"/>'),
  search: svg('<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>'),
  split: svg('<path d="M2 8h4l4-4h4M6 8l4 4h4"/>'),
  mix: svg('<path d="M14 8h-4L6 4H2M10 8l-4 4H2"/>'),
  // an input or an output: a jack and its lead
  jack: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h8"/><rect x="12" y="12" width="10" height="8" rx="2"/><path d="M22 14.5h4.5M22 17.5h4.5"/><path d="M4 16c0-6 4-9 9-9"/></svg>',
};

// ---- which block, and what it is (as Focus Mode's page has it) -------------------------------------------------
const NEUTRAL = [152, 152, 152], NAM_TINT = [176, 112, 224];
const model = block => catalog.models[block.model] || {name: block.model, category: '', key: '', tint: NEUTRAL, pictures: [], params: []};
const isNam = block => catalog.nam.includes(block.model);
const isChain = block => /^block\d{1,2}$/.test(block.id);
const isEnd = block => /^(input|output)[AB]$/.test(block.id);
const namKinds = () => (catalog.nam_kinds && catalog.nam_kinds.length ? catalog.nam_kinds : [{name: 'NAM', gears: []}]);
function namKind(taken) {
  const kinds = namKinds();
  return (kinds.find(kind => kind.gears.includes((taken && taken.gear) || '')) || kinds[kinds.length - 1]).name;
}
function capture(block) {
  if (!isNam(block) || !Number.isInteger(block.slot)) return null;
  return (state.captures || []).find(c => c.slot === block.slot) || {slot: block.slot, name: 'IR slot ' + block.slot, icon: ''};
}
const captureUrls = c => c && c.icon ? catalog.captures.pictures.map(url => url.replace('{icon}', encodeURIComponent(c.icon))) : [];
function pictures(block) {
  const taken = capture(block);
  return taken && taken.icon ? captureUrls(taken).concat(model(block).pictures) : model(block).pictures;
}
const tint = block => isNam(block) ? NAM_TINT : model(block).tint || NEUTRAL;
function title(block) {
  const taken = capture(block);
  if (taken) return taken.name;
  if (isEnd(block)) return endName(block) || model(block).name;
  return model(block).name;
}
function kindOf(block) {
  const taken = capture(block);
  if (taken) return 'gear' in taken ? namKind(taken) : model(block).name;
  if (block.id === 'split') return 'Split';
  if (block.id === 'join') return 'Mixer';
  if (isEnd(block)) return block.id.startsWith('input') ? 'Input' : 'Output';
  return model(block).category || '';
}
function endName(block) {
  if (block.id.startsWith('input')) return workbenchName(catalog.inputs, block.input);
  return workbenchName(catalog.outputs, block.output);
}
function current() {
  if (!state || !state.selected) return null;
  return state.blocks.find(b => b.dsp === state.selected.dsp && b.id === state.selected.id) || null;
}
// A picture that tries each of its addresses in turn (the large render first where asked, else the small one).
// A picture already showing is moved to where it is wanted, not loaded again (a redraw must not flash the pictures
// empty): drawChain and drawPanel gather their pictures first (reusable), image() takes one with the same addresses.
let reusable = null;
function gather(container) {
  const found = new Map();
  for (const img of container.querySelectorAll('img[data-pics]')) {
    if (!found.has(img.dataset.pics)) found.set(img.dataset.pics, []);
    found.get(img.dataset.pics).push(img);
  }
  return found;
}
function image(urls, cls, small, lazy) {
  const key = (small ? 's|' : 'l|') + (urls || []).join('|'), kept = reusable && reusable.get(key);
  if (kept && kept.length) { const img = kept.pop(); img.className = cls || ''; return img; }
  const img = el('img', cls), list = (urls || []).slice();
  img.dataset.pics = key;
  if (small) list.reverse();
  img.alt = ''; img.draggable = false;
  if (lazy) img.loading = 'lazy';                               // (only the picker's many cards wait until they are in view)
  img.onerror = () => { if (list.length) img.src = list.shift(); else img.style.visibility = 'hidden'; };
  if (list.length) img.src = list.shift(); else img.style.visibility = 'hidden';
  return img;
}

// ---- the chain --------------------------------------------------------------------------------------------------
const YA = 52, YB = 166, X0 = 74, R = 14;
let shownChain = '';
function geometry(width) {
  // Eight places between the input (left) and the output (right); a gap is where the split or the mixer sits.
  const end = Math.max(X0 + 8 * 90, width - 74), step = (end - X0) / 8, tile = Math.min(105, step - 18);
  return {width, end, step, tile, px: k => X0 + step * k + (step - tile) / 2, gap: k => X0 + step * k};
}
// A change to the chain asked for here, shown until HX Edit's reading has it (workbenchPending).
let pending = null, pendingTimer = 0;
const PENDING_MS = 3000;
function chainAsk(action, value) {
  const block = value.id ? state.blocks.find(b => b.dsp === value.dsp && b.id === value.id) : null;
  // (to the other path's lane B: pasted on its lane A first and moved down once the Floor has it, up to 4 s later)
  const wait = action === 'move' && value.to !== undefined && value.lane === 1 ? 6000 : PENDING_MS;
  pending = {action, ...value, block: block ? {...block} : null, until: Date.now() + wait};
  ask(action, value);
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { pending = null; if (catalog && state) drawChain(true); }, wait + 50);
  if (catalog && state) drawChain(true);
}
function shownBlocks() {
  if (pending && Date.now() > pending.until) pending = null;
  const view = workbenchPending(state.blocks, pending, catalog.nam[0]);
  if (view.settled) pending = null;
  return view.blocks;
}
const same = (a, b) => !!a && !!b && a.dsp === b.dsp && a.id === b.id;
function drawChain(force) {
  const board = $('board'), width = Math.max(800, board.clientWidth - 28 - 88);
  const paths = workbenchPaths(shownBlocks(), catalog, state.topology);
  const now = current();
  const key = JSON.stringify([width, paths.map(p => [p.a, p.b, p.from, p.to, p.split, p.join, p.inputB, p.outputB, p.input, p.output].map(x => JSON.stringify(x))),
                              now && [now.dsp, now.id], (state.captures || []).map(c => [c.slot, c.name, c.icon]), dsp]);
  if (!force && key === shownChain) return;
  if (dragging) return;                                         // (redrawn when the drag ends)
  shownChain = key;
  reusable = gather(board);
  try { board.replaceChildren(...paths.map(p => drawPath(p, geometry(width), now))); } finally { reusable = null; }
}
function drawPath(p, g, now) {
  const two = !!p.b, out = [], wires = [`<path d="M32 ${YA}H${g.width - 32}"/>`];
  const tileOf = (block, place, y) => {
    const button = el('button', 'tile' + (block.enabled ? '' : ' off') + (same(block, now) ? ' on' : '') + (block.id === 'pending' ? ' coming' : ''));
    button.style.cssText = `--c:${tint(block).join(' ')};left:${g.px(place)}px;top:${y - 52}px;width:${g.tile}px`;
    button.dataset.dsp = p.dsp; button.dataset.lane = y === YA ? 0 : 1; button.dataset.place = place;   // (laneBranch)
    const led = el('span', 'led' + (block.enabled ? '' : ' off'));
    const strip = el('div', 'strip', title(block)); strip.append(el('small', '', kindOf(block)));
    button.append(led, image(pictures(block), 'pic', true), strip);
    button.title = title(block) + (capture(block) ? ' (' + model(block).name + ')' : '') + (block.enabled ? '' : ', bypassed');
    button.onclick = () => { if (!dragDone) ask('select', {dsp: block.dsp, id: block.id}); };
    button.onpointerdown = event => liftBlock(event, block, button);
    return button;
  };
  const slot = (place, y, lane, offered) => {
    // An empty place: click to add a block here; while a block is dragged, a place it can go.
    const plus = el('button', 'slot spot' + (picking && picking.place && picking.dsp === p.dsp && picking.lane === lane && picking.place === place ? ' picking' : ''), '+');
    plus.style.cssText = `left:${g.px(place) + g.tile / 2}px;top:${y}px` + (offered ? ';visibility:hidden' : '');
    plus.dataset.dsp = p.dsp; plus.dataset.lane = lane; plus.dataset.place = place;
    if (offered) plus.classList.add('offered');              // lane B on a path without one: shown only while dragging
    plus.title = 'Add a block here (Path ' + (p.dsp + 1) + ', lane ' + (lane ? 'B' : 'A') + ', place ' + (place + 1) + ')';
    plus.setAttribute('aria-label', plus.title);
    plus.onclick = () => openPlacePicker(p.dsp, lane, place);
    return plus;
  };
  const io = (end, y, right) => {
    const block = end.block, button = el('button', 'tile io' + (same(block, now) ? ' on' : ''));
    button.style.cssText = `left:${right ? g.width - 64 : 0}px;top:${y - 40}px`;
    button.insertAdjacentHTML('beforeend', ICON.jack);
    if (right) button.firstChild.style.transform = 'scaleX(-1)';
    button.append(el('div', 'strip', end.name || '—'));
    button.title = (block.id.startsWith('input') ? 'Input: ' : 'Output: ') + (end.name || 'none');
    button.onclick = () => ask('select', {dsp: block.dsp, id: block.id});
    return button;
  };
  if (two) {
    const from = p.from, to = p.to;
    wires.push(`<path class="b" d="${p.inputB ? `M32 ${YB}` : `M${g.gap(from)} ${YA}V${YB - R}Q${g.gap(from)} ${YB} ${g.gap(from) + R} ${YB}`}${p.outputB ? `H${g.width - 32}` : `H${g.gap(to) - R}Q${g.gap(to)} ${YB} ${g.gap(to)} ${YB - R}V${YA}`}"/>`);
    for (let k = from; k < to; k++) out.push(p.b[k] ? tileOf(p.b[k], k, YB) : slot(k, YB, 1));
    if (p.inputB) out.push(io(p.inputB, YB, false));
    else if (p.split) {
      const node = el('span', 'node movable' + (same(p.split, now) ? ' on' : '')); node.innerHTML = ICON.split; node.style.cssText = `left:${g.gap(from)}px;top:${YA}px`;
      node.title = model(p.split).name + ': click for its settings, drag it left or right along the path.';
      node.onpointerdown = event => liftNode(event, p, 'split', node, g);
      node.onclick = () => { if (!dragDone) ask('select', {dsp: p.dsp, id: 'split'}); };
      const note = el('div', 'note r'); note.append(el('b', '', model(p.split).name), el('small', '', workbenchSplitNote(p.split, splitFormat(p.split))));
      note.style.cssText = `right:${g.width - g.gap(from) + 20}px;top:${YB}px`;
      out.push(node, note);
    }
    if (p.outputB) out.push(io(p.outputB, YB, true));
    else if (p.join) {
      const node = el('span', 'node movable' + (same(p.join, now) ? ' on' : '')); node.innerHTML = ICON.mix; node.style.cssText = `left:${g.gap(to)}px;top:${YA}px`;
      node.title = 'Mixer: click for its settings, drag it left or right along the path.';
      node.onpointerdown = event => liftNode(event, p, 'join', node, g);
      node.onclick = () => { if (!dragDone) ask('select', {dsp: p.dsp, id: 'join'}); };
      const note = el('div', 'note'); note.append(el('b', '', 'Mixer'), el('small', '', workbenchMixNote(p.join)));
      note.style.cssText = `left:${g.gap(to) + 20}px;top:${YB}px`;
      out.push(node, note);
    }
  }
  p.a.forEach((block, k) => out.push(block ? tileOf(block, k, YA) : slot(k, YA, 0)));

  if (!two) {
    const hint = el('div', 'laneb-hint offered'); hint.style.cssText = `top:${YB}px;visibility:hidden`;
    out.push(hint);
    for (let k = 0; k < 8; k++) out.push(slot(k, YB, 1, true));
  }
  if (p.input) out.push(io(p.input, YA, false));
  if (p.output) out.push(io(p.output, YA, true));
  const row = el('div', 'path'), tag = el('div', 'tag'), grid = el('div', 'grid8');

  else if (message.type === 'notice') { toast(message.text); return; }
  else if (message.type === 'shown') { visible = message.shown === true; if (!visible) { closePresets(); closeMenu(); $('toast').hidden = true; } else render(); return; }
  else return;
  render();
}
if (host) host.addEventListener('message', event => receive(event.data));
addEventListener('dragstart', event => event.preventDefault());
window.workbenchReceive = receive;                              // (tests and the preview feed the page through this)
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="kg" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#4a4f5b"/><stop offset=".55" stop-color="#23262e"/><stop offset="1" stop-color="#15171c"/></radialGradient></defs></svg>');

$('undo').onclick = () => ask('undo');
$('redo').onclick = () => { redoAskedAt = Date.now(); ask('redo'); };
$('save').onclick = () => ask('save');
$('toFocus').onclick = () => ask('menu', 'focus');
$('presetPrev').onclick = () => { closePresets(); ask('preset', 'previous'); };
$('presetNext').onclick = () => { closePresets(); ask('preset', 'next'); };
$('presetButton').onclick = () => $('presetList').hidden ? openPresets() : closePresets();
$('menuButton').onclick = () => $('menu').hidden ? openMenu() : closeMenu();
addEventListener('pointerdown', e => {
  if (!$('presetList').hidden && !e.target.closest('#presetList, #presetButton')) closePresets();
  if (!$('menu').hidden && !e.target.closest('#menu, #menuButton')) closeMenu();
});
addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && visible && !e.target.closest('input')) {
    const block = current();
    if (block && isChain(block)) { e.preventDefault(); removeBlock(block); }
    return;
  }
  if (e.key !== 'Escape' || !visible) return;
  if (!$('presetList').hidden) closePresets(); else if (!$('menu').hidden) closeMenu(); else if (picking) closePicker();
});
let resizing = 0;
addEventListener('resize', () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(() => { if (catalog && state) drawChain(); }); });
</script>
</body>
